  <script>
    // Global PWA State Store
    window.__ALLURE_PWA__ = {
      deferredPrompt: null,
      isInstalled: false,
      isStandalone: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true,
      listeners: []
    };

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__ALLURE_PWA__.deferredPrompt = e;
      window.__ALLURE_PWA__.notifyListeners();
    });

    // Detect successful install
    window.addEventListener('appinstalled', () => {
      window.__ALLURE_PWA__.isInstalled = true;
      window.__ALLURE_PWA__.deferredPrompt = null;
      window.__ALLURE_PWA__.notifyListeners();
      console.log('🌸 [ALLURE] Aplikasi ALLURE berhasil diinstal di perangkat.');
    });

    window.__ALLURE_PWA__.subscribe = function(cb) {
      window.__ALLURE_PWA__.listeners.push(cb);
      cb({
        canInstall: !!window.__ALLURE_PWA__.deferredPrompt,
        isInstalled: window.__ALLURE_PWA__.isInstalled,
        isStandalone: window.__ALLURE_PWA__.isStandalone
      });
      return () => {
        window.__ALLURE_PWA__.listeners = window.__ALLURE_PWA__.listeners.filter(l => l !== cb);
      };
    };

    window.__ALLURE_PWA__.notifyListeners = function() {
      const state = {
        canInstall: !!window.__ALLURE_PWA__.deferredPrompt,
        isInstalled: window.__ALLURE_PWA__.isInstalled,
        isStandalone: window.__ALLURE_PWA__.isStandalone
      };
      window.__ALLURE_PWA__.listeners.forEach(cb => {
        try { cb(state); } catch(err) { /* silent */ }
      });
    };

    // Global trigger for Install prompt
    window.promptAllureInstall = async function() {
      const pwa = window.__ALLURE_PWA__;
      if (pwa.deferredPrompt) {
        pwa.deferredPrompt.prompt();
        const choice = await pwa.deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          console.log('🌸 [ALLURE] Pengguna menerima pemasangan aplikasi');
        }
        pwa.deferredPrompt = null;
        pwa.notifyListeners();
      } else if (pwa.isStandalone) {
        alert('✨ Aplikasi ALLURE sudah terpasang dan berjalan dalam mode aplikasi desktop!');
      } else {
        alert('🌸 Pasang ALLURE sebagai Aplikasi Desktop:\n\n1. Klik ikon "Install" di address bar browser Anda, ATAU\n2. Buka menu browser (titik 3 di kanan atas) > pilih "Aplikasi" / "Apps" > "Instal ALLURE ini sebagai aplikasi".\n\nAplikasi akan langsung muncul di Desktop & Taskbar tanpa browser address bar!');
      }
    };

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((registration) => {
            console.log('🌸 [ALLURE] Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.warn('⚠️ [ALLURE] Service Worker registration skipped:', error);
          });
      });
    }

  // HELPER FORMATTERS

  function formatRupiah(amount) {
    if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
    return 'Rp ' + Math.round(amount).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatDate(dateStr) {
    try {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(d);
    } catch {
      return dateStr;
    }
  }

  function cleanPhone(phone) {
    if (!phone) return '';
    let cleaned = phone.replace(/\D/g, '');
    if (cleaned.startsWith('0')) cleaned = '62' + cleaned.slice(1);
    else if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
    return cleaned;
  }

  function getTierMultiplier(tier) {
    switch (tier) {
      case 'Platinum': return 2.0;
      case 'Gold': return 1.5;
      case 'Silver': return 1.2;
      default: return 1.0;
    }
  }

  function calculateTier(points) {
    if (points >= 3500) return 'Platinum';
    if (points >= 1500) return 'Gold';
    if (points >= 500) return 'Silver';
    return 'Bronze';
  }

  function generateWhatsAppMessage(customerName, category, brandName = 'ALLURE') {
    const firstName = customerName.split(' ')[0] || customerName;
    switch (category) {
      case 'Follow-up Keranjang Belanja':
        return `Halo Kak ${firstName}, salam hangat dari ${brandName}! ✨\n\nKami melihat Kakak sempat memilih koleksi hijab premium kami namun belum sempat menyelesaikan pesanan. Apakah ada warna atau ukuran yang ingin dikonsultasikan? Stok koleksi eksklusif ini sangat terbatas lho Kak. Hubungi kami jika butuh bantuan ya!`;
      case 'Promo Peluncuran Hijab Baru':
        return `Assalamu'alaikum Kak ${firstName}! 🌸\n\nKabar gembira dari ${brandName}! Koleksi terbaru *Parisian Silk & Pashmina Viscose Turkey* kini resmi dirilis dengan pilihan warna nude & earthy tone yang elegan. Dapatkan penawaran istimewa untuk pembelian hari ini. Intip koleksinya sekarang yuk Kak!`;
      case 'Penawaran Khusus Member VIP':
        return `Halo Kak ${firstName} yang terhormat, member VIP ${brandName} tercinta 👑\n\nSebagai bentuk apresiasi atas kesetiaan Kakak, kami menyiapkan voucher apresiasi eksklusif dengan diskon istimewa + double loyalty points untuk kunjungan/pembelian minggu ini. Terima kasih telah selalu tampil anggun bersama ${brandName}.`;
      case 'Cek Kepuasan Pelanggan':
        return `Assalamu'alaikum Kak ${firstName}! 🤍\n\nPesanan hijab dari ${brandName} sudah sampai dengan baik ya Kak? Bagaimana kenyamanan bahan dan warnanya saat dikenakan? Masukan dari Kakak sangat berharga bagi kami untuk terus menghadirkan karya terbaik. Selamat beraktivitas!`;
      default:
        return `Halo Kak ${firstName}, terima kasih telah menjadi bagian dari keluarga ${brandName}.`;
    }
  }

  function generateWhatsAppUrl(phone, customerName, category, brandName = 'ALLURE') {
    const cp = cleanPhone(phone);
    const msg = generateWhatsAppMessage(customerName, category, brandName);
    return `https://wa.me/${cp}?text=${encodeURIComponent(msg)}`;
  }

  function CustomersView({ customers, onAddCustomer, onUpdateCustomer, onDeleteCustomer }) {
    const [search, setSearch] = useState('');
    const [selectedSegment, setSelectedSegment] = useState('all');
    const [selectedTier, setSelectedTier] = useState('all');

    // Modals
    const [isAddOpen, setIsAddOpen] = useState(false);
    const [viewCust, setViewCust] = useState(null);
    const [editCust, setEditCust] = useState(null);

    // Add Form
    const [addName, setAddName] = useState('');
    const [addPhone, setAddPhone] = useState('');
    const [addEmail, setAddEmail] = useState('');
    const [addCity, setAddCity] = useState('Jakarta');
    const [addSegment, setAddSegment] = useState('New Customer');
    const [addNotes, setAddNotes] = useState('');

    const filtered = customers.filter(c => {
      const matchSearch =
        c.name.toLowerCase().includes(search.toLowerCase()) ||
        c.phone.includes(search) ||
        c.email.toLowerCase().includes(search.toLowerCase()) ||
        c.city.toLowerCase().includes(search.toLowerCase());

      const normSeg = c.segment === 'New' ? 'New Customer' : (c.segment === 'Loyal' || c.segment === 'High Value') ? 'Loyal/VIP' : c.segment;
      const matchSeg = selectedSegment === 'all' || normSeg === selectedSegment || c.segment === selectedSegment;
      const matchTier = selectedTier === 'all' || c.tier === selectedTier;
      return matchSearch && matchSeg && matchTier;
    });

    const handleAddSubmit = (e) => {
      e.preventDefault();
      if (!addName.trim() || !addPhone.trim()) return;
      onAddCustomer({
        name: addName.trim(),
        phone: addPhone.trim(),
        email: addEmail.trim() || `${addName.toLowerCase().replace(/\s+/g, '')}@boutique.id`,
        city: addCity.trim() || 'Jakarta',
        segment: addSegment,
        notes: addNotes.trim()
      });
      setIsAddOpen(false);
      setAddName('');
      setAddPhone('');
      setAddEmail('');
      setAddNotes('');
    };

      e.preventDefault();
      if (!editCust) return;

  // -------------------------------------------------------------
  // COMPONENT: POS VIEW (MODULE 4)
  // -------------------------------------------------------------
  function PosView({ products, customers, vouchers, onProcessOrder, settings, transactions, onOpenInvoice }) {
    const [posTab, setPosTab] = useState('pos');
    const [selectedCustId, setSelectedCustId] = useState(customers[0]?.id || '');
    const [cart, setCart] = useState([]);
    const [voucherInput, setVoucherInput] = useState('');
    const [appliedVoucher, setAppliedVoucher] = useState(null);
    const [paymentMethod, setPaymentMethod] = useState('BCA Transfer');
    const [searchProd, setSearchProd] = useState('');
    const [selectedCat, setSelectedCat] = useState('all');

    const currCust = customers.find(c => c.id === selectedCustId);
    const subtotal = cart.reduce((s, it) => s + (it.product.price * it.qty), 0);

    let discount = 0;
    if (appliedVoucher) {
      const v = vouchers.find(v => v.code === appliedVoucher && v.isActive);
      if (v && subtotal >= v.minSpend) {
        if (v.discountType === 'percentage') {
          discount = Math.round((subtotal * v.discountValue) / 100);
          if (v.maxDiscount && discount > v.maxDiscount) discount = v.maxDiscount;
        } else {
          discount = v.discountValue;
        }
      }
    }
    const grandTotal = Math.max(0, subtotal - discount);
    const tierMultiplier = currCust ? getTierMultiplier(currCust.tier) : 1;
    const estPoints = Math.round(Math.floor(grandTotal / 1000) * tierMultiplier * (settings.pointsMultiplier || 1));

    const addToCart = (product) => {
      if (product.stock <= 0) return alert('Stok produk habis!');
      setCart(prev => {
        const inCartQty = prev.filter(it => it.product.id === product.id).reduce((s, it) => s + it.qty, 0);
        if (inCartQty >= product.stock) {
          alert('Stok maksimal tercapai!');
          return prev;
        }
        const defColor = product.colors[0] || '#DDA7A5';
        const exist = prev.find(it => it.product.id === product.id && it.selectedColor === defColor);
        if (exist) {
          return prev.map(it => it.product.id === product.id && it.selectedColor === defColor ? { ...it, qty: it.qty + 1 } : it);
        }
        return [...prev, { product, qty: 1, selectedColor: defColor }];
      });
    };

    const handleCheckout = () => {
      if (cart.length === 0) return alert('Keranjang kasir masih kosong.');
      if (!selectedCustId) return alert('Pilih pelanggan terlebih dahulu.');

      const success = onProcessOrder({
        customerId: selectedCustId,
        items: cart,
        voucherCode: appliedVoucher,
        paymentMethod,
        cashierName: 'Admin Allure'
      });

      if (success) {
        setCart([]);
        setAppliedVoucher(null);
        setVoucherInput('');
      }
    };

    const filteredProds = products.filter(p => {
      const matchSearch = p.name.toLowerCase().includes(searchProd.toLowerCase()) || p.sku.toLowerCase().includes(searchProd.toLowerCase());
      const matchCat = selectedCat === 'all' || p.category === selectedCat;
      return matchSearch && matchCat;
    });

    return h('div', { className: 'space-y-6' },
      h('div', { className: 'flex justify-between items-center' },
        h('div', null,
          h('h2', { className: 'font-serif text-2xl font-bold text-[#1F2937]' }, 'Kasir & Transaksi (POS)'),
          h('p', { className: 'text-xs text-[#6B7280]' }, 'Pilih pelanggan, input produk, terapkan voucher diskon, dan cetak invoice')
        )
      ),

      // Sub-tab: POS vs History
      h('div', { className: 'flex gap-2 border-b border-[#EFE8DE] pb-3' },
        h('button', {
          onClick: () => setPosTab('pos'),
          className: `flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold ${
            posTab === 'pos' ? 'bg-[#C48B89] text-white shadow-xs' : 'bg-white border text-[#6B7280]'
          }`
        },
          h(Icon, { name: 'shopping-cart', className: 'w-3.5 h-3.5' }),
          'Kasir Interaktif (POS)'
        ),
        h('button', {
          onClick: () => setPosTab('history'),
          className: `flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold ${
            posTab === 'history' ? 'bg-[#C48B89] text-white shadow-xs' : 'bg-white border text-[#6B7280]'
          }`
        },
          h(Icon, { name: 'receipt', className: 'w-3.5 h-3.5' }),
          'Riwayat Transaksi'
        )
      ),

      posTab === 'history' ? h(TransactionsView, { transactions, onOpenInvoice }) :
      h('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6 items-start' },
        // Left Column: Customer & Products (7 cols)
        h('div', { className: 'lg:col-span-7 space-y-4' },
          h('div', { className: 'p-4 bg-white rounded-2xl border border-[#EFE8DE] shadow-sm' },
            h('label', { className: 'text-xs font-semibold text-[#1F2937] block mb-1.5' }, 'Pilih Pelanggan Transaksi:'),
            h('select', {
              value: selectedCustId,
              onChange: (e) => setSelectedCustId(e.target.value),
              className: 'w-full p-2.5 bg-[#FAF7F2] rounded-xl border border-[#EFE8DE] text-xs font-medium text-[#1F2937]'
            },
              customers.map(c => h('option', { key: c.id, value: c.id }, `${c.name} — ${c.phone} [${c.tier}]`))
            )
          ),

          // Products Catalog
          h('div', { className: 'p-4 bg-white rounded-2xl border border-[#EFE8DE] shadow-sm space-y-3' },
            h('div', { className: 'flex gap-2' },
              h('input', {
                type: 'text',
                placeholder: 'Cari hijab atau SKU...',
                value: searchProd,

              }),

  function WishlistView({ wishlistItems, onRestock, onBroadcast, settings }) {
    const [broadcastModalItem, setBroadcastModalItem] = useState(null);
    const [restockModalItem, setRestockModalItem] = useState(null);
    const [restockQty, setRestockQty] = useState(30);

    const totalWaiting = wishlistItems.reduce((acc, w) => acc + (w.wishlistCount || (w.interestedCustomers ? w.interestedCustomers.length : 0)), 0);
    const outOfStockCount = wishlistItems.filter(i => i.stock <= 0).length;

    const handleExecuteRestock = (e) => {
      e.preventDefault();
      if (!restockModalItem) return;
      onRestock(restockModalItem.id, Number(restockQty));
      setRestockModalItem(null);
      setRestockQty(30);
    };

    const handleExecuteBroadcast = () => {
      if (!broadcastModalItem) return;
      onBroadcast(broadcastModalItem.id);
      setBroadcastModalItem(null);
      alert('Siaran WhatsApp restock berhasil disimulasikan!');
    };

    return h('div', { className: 'space-y-6' },
      h('div', null,
        h('h2', { className: 'font-serif text-2xl font-bold text-[#1F2937]' }, 'Wishlist & Restock Hijab (Module 7)'),

  // -------------------------------------------------------------
  // MASTER APPLICATION ROOT COMPONENT
  // -------------------------------------------------------------
  function AllureApp() {
    // Session State: Default unauthenticated so fresh launch starts at executive login screen
    const [isAuthenticated, setIsAuthenticated] = useState(() => {
      try {
        return sessionStorage.getItem('allure_session_active') === 'true';
      } catch (e) {
        return false;
      }
    });

    const [currentUser] = useState({
      id: 'admin-001',
      name: 'Admin Allure',
      email: 'admin@allure.boutique',
      role: 'Administrator Allure Space',
      avatar: 'AL'
    });

    // Auto-clean migration to reset data to initial clean slate (0 transactions)
    try {
      if (!localStorage.getItem('allure_clean_slate_v3')) {
        localStorage.setItem('allure_transactions_v1', JSON.stringify([]));
        localStorage.setItem('allure_followups_v1', JSON.stringify([]));
        localStorage.setItem('allure_tickets_v1', JSON.stringify([]));
        localStorage.setItem('allure_wishlist_v1', JSON.stringify([]));
        localStorage.setItem('allure_customers_v1', JSON.stringify(INITIAL_CUSTOMERS));
        localStorage.setItem('allure_products_v1', JSON.stringify(INITIAL_PRODUCTS));
        localStorage.setItem('allure_vouchers_v1', JSON.stringify(INITIAL_VOUCHERS));
        localStorage.setItem('allure_logs_v1', JSON.stringify(INITIAL_LOGS));
        localStorage.setItem('allure_clean_slate_v3', 'true');
      }
    } catch (e) {
      console.warn('Storage cleaner:', e);
    }

    const [products, setProducts] = useState(() => {
      const saved = localStorage.getItem('allure_products_v1');
      return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
    });

    const [customers, setCustomers] = useState(() => {
      const saved = localStorage.getItem('allure_customers_v1');
      return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
    });

    const [wishlistItems, setWishlistItems] = useState(() => {
      const saved = localStorage.getItem('allure_wishlist_v1');
      return saved ? JSON.parse(saved) : INITIAL_WISHLIST;
    });

    const [transactions, setTransactions] = useState(() => {
      const saved = localStorage.getItem('allure_transactions_v1');
      return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
    });

    const [followUps, setFollowUps] = useState(() => {
      const saved = localStorage.getItem('allure_followups_v1');
      return saved ? JSON.parse(saved) : INITIAL_FOLLOW_UPS;
    });

    const [vouchers, setVouchers] = useState(() => {
      const saved = localStorage.getItem('allure_vouchers_v1');
      return saved ? JSON.parse(saved) : INITIAL_VOUCHERS;
    });

    const [tickets, setTickets] = useState(() => {
      const saved = localStorage.getItem('allure_tickets_v1');
      return saved ? JSON.parse(saved) : INITIAL_TICKETS;
    });

    const [activityLogs, setActivityLogs] = useState(() => {
      const saved = localStorage.getItem('allure_logs_v1');
      return saved ? JSON.parse(saved) : INITIAL_LOGS;
    });

    const [settings, setSettings] = useState(() => {
      try {
        const saved = localStorage.getItem('allure_settings_v1');
        const loaded = saved ? JSON.parse(saved) : INITIAL_SETTINGS;
        if (!loaded.subTagline || loaded.tagline === 'Modest Elegance & Boutique Atelier' || loaded.tagline === 'Modest Elegance & Atelier') {
          return {
            ...loaded,
            tagline: 'BUSINESS SPACE',
            subTagline: 'Everything Behind Allure'
          };
        }
        return loaded;
      } catch (e) {
        return INITIAL_SETTINGS;
      }
    });

    // Navigation and Modals
    const [currentTab, setCurrentTab] = useState('dashboard');
    const [isMobileOpen, setIsMobileOpen] = useState(false);
    const [searchQuery, setSearchQuery] = useState('');
    const [activeInvoice, setActiveInvoice] = useState(null);

    // Dropdowns
    const [isNotifOpen, setIsNotifOpen] = useState(false);
    const [isProfileOpen, setIsProfileOpen] = useState(false);

    // Sync to storage
    useEffect(() => {
      try {
        if (isAuthenticated) {
          sessionStorage.setItem('allure_session_active', 'true');
        } else {
          sessionStorage.removeItem('allure_session_active');
          localStorage.removeItem('allure_auth_v1');
        }
      } catch (e) {}
    }, [isAuthenticated]);
    useEffect(() => { localStorage.setItem('allure_products_v1', JSON.stringify(products)); }, [products]);
    useEffect(() => { localStorage.setItem('allure_customers_v1', JSON.stringify(customers)); }, [customers]);
    useEffect(() => { localStorage.setItem('allure_wishlist_v1', JSON.stringify(wishlistItems)); }, [wishlistItems]);
    useEffect(() => { localStorage.setItem('allure_transactions_v1', JSON.stringify(transactions)); }, [transactions]);
    useEffect(() => { localStorage.setItem('allure_followups_v1', JSON.stringify(followUps)); }, [followUps]);
    useEffect(() => { localStorage.setItem('allure_vouchers_v1', JSON.stringify(vouchers)); }, [vouchers]);
    useEffect(() => { localStorage.setItem('allure_tickets_v1', JSON.stringify(tickets)); }, [tickets]);
    useEffect(() => { localStorage.setItem('allure_logs_v1', JSON.stringify(activityLogs)); }, [activityLogs]);
    useEffect(() => { localStorage.setItem('allure_settings_v1', JSON.stringify(settings)); }, [settings]);

    const addLog = (type, title, description, actor = 'Siti Admin') => {
      const entry = {
        id: 'log-' + Date.now(),
        timestamp: new Date().toISOString(),
        type,
        title,
        description,
        actor
      };
      setActivityLogs(prev => [entry, ...prev.slice(0, 49)]);
    };

    // Core POS Checkout
    const handleProcessOrder = ({ customerId, items, voucherCode, paymentMethod, cashierName }) => {
      const cust = customers.find(c => c.id === customerId);
      if (!cust) return false;

      // Stock check
      const qtyMap = {};
      for (const it of items) qtyMap[it.product.id] = (qtyMap[it.product.id] || 0) + it.qty;
      for (const [pId, reqQty] of Object.entries(qtyMap)) {
        const prod = products.find(p => p.id === pId);
        if (!prod || prod.stock < reqQty) {
          alert(`Stok ${prod ? prod.name : 'produk'} tidak mencukupi!`);
          return false;
        }
      }

      let subtotal = 0;
      const trxItems = items.map(it => {
        const lineTotal = it.product.price * it.qty;
        subtotal += lineTotal;
        return {
          productId: it.product.id,
          productName: it.product.name,
          sku: it.product.sku,
          price: it.product.price,
          qty: it.qty,
          color: it.selectedColor,
          subtotal: lineTotal
        };
      });

      let discountAmount = 0;
      let appliedVoucherCode = null;
      if (voucherCode) {
        const v = vouchers.find(v => v.code === voucherCode && v.isActive);
        if (v && subtotal >= v.minSpend) {
          appliedVoucherCode = v.code;
          if (v.discountType === 'percentage') {
            discountAmount = Math.round((subtotal * v.discountValue) / 100);
            if (v.maxDiscount && discountAmount > v.maxDiscount) discountAmount = v.maxDiscount;
          } else {
            discountAmount = v.discountValue;
          }
        }
      }

      const grandTotal = Math.max(0, subtotal - discountAmount);
      const tierMult = getTierMultiplier(cust.tier);
      const loyaltyEarned = Math.round(Math.floor(grandTotal / 1000) * tierMult * (settings.pointsMultiplier || 1));

      const trxId = 'TRX-' + new Date().toISOString().slice(0, 7).replace('-', '') + '-' + Math.floor(1000 + Math.random() * 9000);

      const newTrx = {
        id: trxId,
        date: new Date().toISOString(),
        customerId: cust.id,
        customerName: cust.name,
        customerPhone: cust.phone,
        customerTier: cust.tier,
        items: trxItems,
        subtotal,
        voucherCode: appliedVoucherCode,
        discountAmount,
        grandTotal,
        paymentMethod,
        loyaltyPointsEarned: loyaltyEarned,
        cashierName: cashierName || 'Siti Admin',
        status: 'Completed'
      };

      // Deduct stock
      setProducts(prev => prev.map(p => {
        const qtyBought = items.filter(it => it.product.id === p.id).reduce((s, it) => s + it.qty, 0);
        if (qtyBought > 0) {
          return { ...p, stock: Math.max(0, p.stock - qtyBought), soldCount: (p.soldCount || 0) + qtyBought };
        }
        return p;
      }));

      // Update customer
      setCustomers(prev => prev.map(c => {
        if (c.id === cust.id) {
          const newSpent = c.totalSpent + grandTotal;
          const newOrders = c.ordersCount + 1;
          const newPoints = c.loyaltyPoints + loyaltyEarned;
          const newTier = calculateTier(newPoints);
          let seg = c.segment;
          if (newSpent >= 4000000) seg = 'Loyal/VIP';
          else if (newOrders >= 4) seg = 'Loyal/VIP';
          else if (newOrders >= 2) seg = 'Regular';

          return {
            ...c,
            totalSpent: newSpent,
            total_pengeluaran: newSpent,
            ordersCount: newOrders,
            jumlah_transaksi: newOrders,
            loyaltyPoints: newPoints,
            tier: newTier,
            segment: seg,
            lastOrderDate: new Date().toISOString()
          };
        }
        return c;
      }));

      // Update voucher
      if (appliedVoucherCode) {
        setVouchers(prev => prev.map(v => v.code === appliedVoucherCode ? { ...v, usedCount: v.usedCount + 1 } : v));
      }

      setTransactions(prev => [newTrx, ...prev]);
      addLog('order', 'Pesanan Kasir Selesai', `${trxId} senilai ${formatRupiah(grandTotal)} untuk Kak ${cust.name}.`, cashierName);
      setActiveInvoice(newTrx);
      return true;
    };

    const handleRestockWishlist = (wishlistId, quantity) => {
      const item = wishlistItems.find(w => w.id === wishlistId);
      if (!item) return;

      setProducts(prev => prev.map(p => {
        if (p.id === item.productId || p.sku === item.sku) {
          return { ...p, stock: p.stock + quantity };
        }
        return p;
      }));

      setWishlistItems(prev => prev.map(w => {
        if (w.id === wishlistId) {
          return { ...w, stock: w.stock + quantity };
        }
        return w;
      }));

      addLog('stock', 'Restock Produk Selesai', `Menambahkan +${quantity} pcs stok untuk "${item.productName}".`);
    };

    const handleBroadcastWishlist = (wishlistId) => {
      const item = wishlistItems.find(w => w.id === wishlistId);
      if (!item) return;

      setWishlistItems(prev => prev.map(w => {
        if (w.id === wishlistId) {
          return { ...w, lastBroadcastDate: new Date().toISOString() };
        }
        return w;
      }));

      addLog('customer', 'Simulasi Broadcast Restock WA', `Mengirim broadcast ke antrean peminat ${item.productName}.`);
    };

    const handleResetAll = () => {
      if (confirm('Reset seluruh data butik ALLURE ke kondisi bawaan awal?')) {
        setProducts(INITIAL_PRODUCTS);
        setCustomers(INITIAL_CUSTOMERS);
        setWishlistItems(INITIAL_WISHLIST);
        setTransactions(INITIAL_TRANSACTIONS);
        setFollowUps(INITIAL_FOLLOW_UPS);
        setVouchers(INITIAL_VOUCHERS);
        setTickets(INITIAL_TICKETS);
        setActivityLogs(INITIAL_LOGS);
        setSettings(INITIAL_SETTINGS);
        setActiveInvoice(null);
        localStorage.clear();
        alert('Data butik ALLURE berhasil direset ke kondisi awal (0 transaksi)!');
      }
    };

    // Calculate notifications (Smart threshold: minStock for favorites, < 5 for regular)
    const lowStockItems = products.filter(p => p.stock <= (p.minStock || 5) || p.stock < 5);
    const pendingFollowUps = followUps.filter(f => f.status === 'Pending');
    const totalAlerts = lowStockItems.length + pendingFollowUps.length;

    const handleLoginSuccess = () => {
      try {
        sessionStorage.setItem('allure_session_active', 'true');
      } catch (e) {}
      setIsAuthenticated(true);
      addLog('setting', 'Admin Berhasil Masuk', 'Siti Admin berhasil login ke ALLURE.');
    };

    const handleLogout = () => {
      try {
        sessionStorage.removeItem('allure_session_active');
        localStorage.removeItem('allure_auth_v1');
      } catch (e) {}
      setIsAuthenticated(false);
      setIsProfileOpen(false);
      addLog('setting', 'Admin Logout', 'Admin keluar dari sesi ALLURE.');
    };

    const handleToggleVoucher = (code) => {
      setVouchers(prev => prev.map(v => v.code === code ? { ...v, isActive: !v.isActive } : v));
      addLog('setting', 'Status Voucher Diperbarui', `Voucher ${code} diubah statusnya.`);
    };

    const handleAddVoucher = (voucher) => {
      setVouchers(prev => [voucher, ...prev]);
      addLog('setting', 'Voucher Baru Ditambahkan', `Kode promo ${voucher.code} siap digunakan.`);
    };

    // Login Gate
    if (!isAuthenticated) {
      return h(LoginView, {
        onLoginSuccess: handleLoginSuccess,
        settings
      });
    }

    return h('div', { className: 'min-h-screen bg-[#FAF7F2] text-[#1F2937] flex flex-col lg:flex-row antialiased font-sans selection:bg-[#E8C3C4] selection:text-[#7D4443]' },
      // Sidebar Navigation
      h('aside', {
        className: `fixed lg:static top-0 left-0 bottom-0 z-50 w-72 bg-white border-r border-[#EFE8DE] flex flex-col transition-transform duration-300 ${
          isMobileOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
        }`
      },
        // Brand Header
        h('div', { className: 'p-6 border-b border-[#EFE8DE] bg-[#FAF7F2]' },
          h('div', { className: 'flex items-center gap-3' },
            h('div', { className: 'w-10 h-10 rounded-2xl bg-[#C48B89] flex items-center justify-center text-white font-serif font-bold text-lg shadow-sm' },
              h(Icon, { name: 'sparkles', className: 'w-5 h-5 text-white' })
            ),
            h('div', null,
              h('h1', { className: 'font-serif text-2xl font-extrabold tracking-widest text-[#1F2937] leading-none' }, settings.brandName || 'ALLURE'),
              h('p', { className: 'text-[10px] tracking-wider font-bold text-[#B2706E] uppercase mt-1' }, settings.tagline || 'BUSINESS SPACE'),
              h('p', { className: 'text-[9px] tracking-wider text-[#6B7280] font-medium mt-0.5' }, settings.subTagline || 'Everything Behind Allure')
            )
          )
        ),

        // Menu items
        h('nav', { className: 'flex-1 overflow-y-auto px-4 py-4 space-y-1' },
          [
            { id: 'dashboard', label: 'Ringkasan Bisnis (Dashboard)', icon: 'layout-dashboard' },
            { id: 'pos', label: 'Kasir Penjualan (POS)', icon: 'shopping-cart' },
            { id: 'products', label: 'Katalog Produk & Stok', icon: 'package', badge: lowStockItems.length > 0 ? `${lowStockItems.length} tipis` : null, badgeColor: 'bg-rose-500' },
            { id: 'customers', label: 'Daftar Pelanggan (CRM)', icon: 'users' },
            { id: 'followup', label: 'Follow-up WhatsApp', icon: 'message-circle', badge: pendingFollowUps.length > 0 ? `${pendingFollowUps.length}` : null, badgeColor: 'bg-emerald-600' },
            { id: 'wishlist', label: 'Antrean Stok Habis (Wishlist)', icon: 'heart-handshake', badge: wishlistItems.filter(w => w.stock <= 0).length > 0 ? `${wishlistItems.filter(w => w.stock <= 0).length} habis` : null, badgeColor: 'bg-[#C48B89]' },
            { id: 'transactions', label: 'Riwayat Transaksi', icon: 'receipt' },
            { id: 'loyalty', label: 'Poin Member & Kupon Diskon', icon: 'award' },
            { id: 'service', label: 'Bantuan & Ulasan Pelanggan', icon: 'headset' },
            { id: 'settings', label: 'Pengaturan Toko & Log', icon: 'settings' }
          ].map(it => {
            const isActive = currentTab === it.id;
            return h('button', {
              key: it.id,
              onClick: () => { setCurrentTab(it.id); setIsMobileOpen(false); },
              className: `w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium transition-all ${
                isActive
                  ? 'bg-[#C48B89] text-white font-semibold shadow-sm'
                  : 'text-[#1F2937] hover:text-[#B2706E] hover:bg-[#FDF8F7]'
              }`
            },
              h('div', { className: 'flex items-center gap-3' },
                h(Icon, { name: it.icon, className: `w-4 h-4 ${isActive ? 'text-white' : 'text-[#6B7280]'}` }),
                h('span', null, it.label)
              ),
              it.badge && h('span', { className: `text-[10px] px-2 py-0.5 rounded-full text-white font-bold ${it.badgeColor}` }, it.badge)
            );
          })
        ),

        // PWA & Desktop App Install Card in Sidebar
        h('div', { className: 'px-4 pb-2' },
          h('button', {
            type: 'button',
            onClick: () => {
              if (window.promptAllureInstall) window.promptAllureInstall();
            },
            title: 'Pasang ALLURE ke Desktop / Layar Utama',
            className: 'w-full flex items-center justify-between p-2.5 rounded-xl bg-[#FAF7F2] border border-[#E8C3C4] text-[#7D4443] hover:border-[#DDA7A5] transition-all text-xs group cursor-pointer text-left shadow-xs'
          },
            h('div', { className: 'flex items-center gap-2.5' },
              h('div', { className: 'w-7 h-7 rounded-lg bg-[#C48B89] text-white flex items-center justify-center shrink-0 shadow-xs' },
                h(Icon, { name: 'download', className: 'w-3.5 h-3.5' })
              ),
              h('div', null,
                h('p', { className: 'font-semibold text-xs text-[#3E2020] leading-tight' }, 'Install ALLURE'),
                h('p', { className: 'text-[10px] text-[#7D4443] leading-tight mt-0.5' }, 'Aplikasi Mandiri Windows')
              )
            ),
            h(Icon, { name: 'chevron-right', className: 'w-3.5 h-3.5 text-[#B2706E] group-hover:translate-x-0.5 transition-transform' })
          )
        ),

        // Sidebar Footer
        h('div', { className: 'p-4 border-t border-[#EFE8DE] bg-[#FAF7F2] space-y-2' },
          h('div', { className: 'p-2.5 bg-white rounded-xl border border-[#EFE8DE] text-xs flex items-center justify-between' },
            h('span', { className: 'font-semibold text-[#1F2937]' }, currentUser.name),
            h('span', { className: 'text-emerald-700 font-medium text-[11px]' }, '● Butik Aktif')
          ),
          h('button', {
            onClick: handleLogout,
            className: 'w-full py-2 text-center text-rose-600 hover:bg-rose-50 text-xs font-semibold border border-[#EFE8DE] rounded-xl transition-all flex items-center justify-center gap-1.5'
          },
            h(Icon, { name: 'log-out', className: 'w-3.5 h-3.5' }),
            'Keluar (Logout)'
          )
        )
      ),

      // Main Content Area
      h('div', { className: 'flex-1 flex flex-col min-w-0 min-h-screen' },
        // Top Header
        h('header', { className: 'sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#EFE8DE] px-4 lg:px-8 py-3.5 flex items-center justify-between' },
          h('div', { className: 'flex items-center gap-3' },
            h('button', { onClick: () => setIsMobileOpen(!isMobileOpen), className: 'p-2 text-[#6B7280] lg:hidden' },
              h(Icon, { name: 'menu', className: 'w-5 h-5' })
            ),
            h('div', null,
              h('h2', { className: 'font-serif text-lg lg:text-xl font-bold text-[#1F2937]' },
                currentTab === 'dashboard' ? 'Ringkasan Bisnis (Dashboard)' :
                currentTab === 'pos' ? 'Kasir Penjualan (POS)' :
                currentTab === 'products' ? 'Katalog Produk & Stok' :
                currentTab === 'customers' ? 'Daftar Pelanggan (CRM)' :
                currentTab === 'followup' ? 'Follow-up WhatsApp' :
                currentTab === 'wishlist' ? 'Antrean Stok Habis (Wishlist)' :
                currentTab === 'transactions' ? 'Riwayat Transaksi' :
                currentTab === 'loyalty' ? 'Poin Member & Kupon Diskon' :
                currentTab === 'service' ? 'Bantuan & Ulasan Pelanggan' : 'Pengaturan Toko & Log'
              ),
              h('p', { className: 'text-xs text-[#6B7280] hidden sm:block' }, 'ALLURE • BUSINESS SPACE — Everything Behind Allure')
            )
          ),

          // Search, Notification Bell, Admin Profile
          h('div', { className: 'flex items-center gap-3' },
            h('div', { className: 'hidden md:flex items-center relative' },
              h('input', {
                type: 'text',
                placeholder: 'Cari sesuatu... (Ctrl + K)',
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                className: 'w-48 lg:w-64 pl-9 pr-3 py-1.5 text-xs bg-[#FAF7F2] border border-[#EFE8DE] rounded-xl text-[#1F2937] focus:outline-none focus:ring-2 focus:ring-[#DDA7A5]'
              }),
              h(Icon, { name: 'search', className: 'w-3.5 h-3.5 absolute left-3 text-[#6B7280]' })
            ),

            currentTab !== 'pos' && h('button', {
              onClick: () => setCurrentTab('pos'),
              className: 'hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 bg-[#C48B89] text-white text-xs font-semibold rounded-xl shadow-xs'
            },
              h(Icon, { name: 'shopping-cart', className: 'w-3.5 h-3.5' }),
              'Buka Kasir'
            ),

            // Install Aplikasi ALLURE (PWA & Desktop) Button
            h('button', {
              type: 'button',
              onClick: () => {
                if (window.promptAllureInstall) window.promptAllureInstall();
              },
              title: 'Pasang ALLURE sebagai aplikasi mandiri di Taskbar/Desktop',
              className: 'flex items-center gap-1.5 px-3 py-1.5 bg-[#FDF8F7] hover:bg-[#F3D8D7] text-[#7D4443] border border-[#E8C3C4] text-xs font-semibold rounded-xl transition-all shadow-xs cursor-pointer'
            },
              h(Icon, { name: 'download', className: 'w-3.5 h-3.5 text-[#B2706E]' }),
              h('span', { className: 'hidden md:inline' }, 'Install App')
            ),

            // Notification Bell
            h('div', { className: 'relative' },
              h('button', {
                onClick: () => { setIsNotifOpen(!isNotifOpen); setIsProfileOpen(false); },
                className: 'p-2 rounded-xl border border-[#EFE8DE] text-[#6B7280] hover:text-[#1F2937] hover:bg-[#FAF7F2] relative'
              },
                h(Icon, { name: 'bell', className: 'w-4 h-4' }),
                totalAlerts > 0 && h('span', { className: 'absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white rounded-full text-[9px] font-bold flex items-center justify-center animate-pulse' }, totalAlerts)
              ),

              isNotifOpen && h('div', { className: 'absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-[#EFE8DE] p-4 z-50 space-y-3' },
                h('div', { className: 'flex justify-between items-center border-b border-gray-100 pb-2' },
                  h('span', { className: 'text-xs font-bold text-[#1F2937]' }, `Notifikasi (${totalAlerts})`),
                  h('span', { className: 'text-[10px] text-[#B2706E] cursor-pointer font-semibold', onClick: () => setIsNotifOpen(false) }, 'Tutup')
                ),
                h('div', { className: 'space-y-2 max-h-60 overflow-y-auto text-xs' },
                  lowStockItems.length > 0 && h('div', { className: 'p-2.5 rounded-xl bg-rose-50 border border-rose-100' },
                    h('p', { className: 'font-semibold text-rose-800' }, '⚠️ Peringatan Stok Menipis'),
                    h('p', { className: 'text-[11px] text-rose-600 mt-0.5' }, `${lowStockItems.length} produk hijab tersisa < 5 pcs.`),
                    h('button', { onClick: () => { setCurrentTab('products'); setIsNotifOpen(false); }, className: 'text-[10px] text-rose-700 font-bold underline mt-1 block' }, 'Buka Katalog Hijab →')
                  ),
                  pendingFollowUps.length > 0 && h('div', { className: 'p-2.5 rounded-xl bg-emerald-50 border border-emerald-100' },
                    h('p', { className: 'font-semibold text-emerald-800' }, '💬 Follow-up Tertunda'),
                    h('p', { className: 'text-[11px] text-emerald-700 mt-0.5' }, `${pendingFollowUps.length} pesan WhatsApp perlu dikirim hari ini.`),
                    h('button', { onClick: () => { setCurrentTab('followup'); setIsNotifOpen(false); }, className: 'text-[10px] text-emerald-800 font-bold underline mt-1 block' }, 'Buka CRM Follow-Up →')
                  ),
                  totalAlerts === 0 && h('p', { className: 'text-center py-4 text-[#6B7280] italic' }, 'Semua notifikasi aman.')
                )
              )
            ),

            // Admin Profile Dropdown
            h('div', { className: 'relative' },
              h('button', {
                onClick: () => { setIsProfileOpen(!isProfileOpen); setIsNotifOpen(false); },
                className: 'flex items-center gap-2 p-1.5 sm:px-3 sm:py-1.5 rounded-xl border border-[#EFE8DE] hover:border-[#DDA7A5] transition-all'
              },
                h('div', { className: 'w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#C48B89] text-white flex items-center justify-center font-bold text-xs' },
                  currentUser.avatar || 'SA'
                ),
                h('div', { className: 'hidden md:block text-left text-xs' },
                  h('p', { className: 'font-semibold text-[#1F2937] leading-tight' }, currentUser.name),
                  h('p', { className: 'text-[10px] text-[#6B7280] leading-tight' }, currentUser.role)
                )
              ),

              isProfileOpen && h('div', { className: 'absolute right-0 mt-2 w-52 bg-white rounded-2xl shadow-xl border border-[#EFE8DE] p-2 z-50 space-y-1 text-xs' },
                h('div', { className: 'px-3 py-2 border-b border-gray-100' },
                  h('p', { className: 'font-bold text-[#1F2937]' }, currentUser.name),
                  h('p', { className: 'text-[10px] text-[#6B7280]' }, currentUser.email)
                ),
                h('button', {
                  onClick: () => { setCurrentTab('settings'); setIsProfileOpen(false); },
                  className: 'w-full text-left px-3 py-2 hover:bg-[#FDF8F7] rounded-xl text-[#1F2937]'
                }, 'Pengaturan Butik'),
                h('button', {
                  onClick: handleLogout,
                  className: 'w-full text-left px-3 py-2 hover:bg-rose-50 text-rose-600 font-semibold rounded-xl flex items-center gap-1.5'
                },
                  h(Icon, { name: 'log-out', className: 'w-3.5 h-3.5' }),
                  'Keluar (Logout)'
                )
              )
            )
          )
        ),

        // Main Module Render (Hook-safe separate components)
        h('main', { className: 'flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto' },
          currentTab === 'dashboard' && h(DashboardView, {
            products,
            customers,
            transactions,
            followUps,
            settings,
            setCurrentTab
          }),
          currentTab === 'pos' && h(PosView, {
            products,
            customers,
            vouchers,
            onProcessOrder: handleProcessOrder,
            settings,
            transactions,
            onOpenInvoice: (trx) => setActiveInvoice(trx)
          }),
          currentTab === 'products' && h(ProductsView, {
            products,
            onAddProduct: (newP) => {
              setProducts(prev => [{ ...newP, id: 'prod-' + Date.now() }, ...prev]);
              addLog('stock', 'Produk Baru Ditambahkan', `Menambahkan katalog "${newP.name}".`);
            },
            onUpdateProduct: (id, updates) => {
              setProducts(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));
              addLog('stock', 'Perubahan Data Produk', `Memperbarui katalog produk ID ${id}.`);
            },
            onDeleteProduct: (id) => {
              setProducts(prev => prev.filter(p => p.id !== id));
              addLog('stock', 'Produk Dihapus', `Menghapus produk ID ${id}.`);
            },
            onAdjustStock: (id, delta) => {
              setProducts(prev => prev.map(p => p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p));
            }
          }),
          currentTab === 'customers' && h(CustomersView, {
            customers,
            onAddCustomer: (newC) => {
              const c = {
                id: 'cust-' + Date.now(),
                ...newC,
                tier: 'Bronze',
                loyaltyPoints: 0,
                totalSpent: 0,
                total_pengeluaran: 0,
                ordersCount: 0,
                jumlah_transaksi: 0,
                joinedDate: new Date().toISOString().slice(0, 10),
                lastOrderDate: '-'
              };
              setCustomers(prev => [c, ...prev]);
              addLog('customer', 'Pelanggan Baru Terdaftar', `Menambahkan Kak ${c.name}.`);
            },
            onUpdateCustomer: (id, updates) => {
              setCustomers(prev => prev.map(c => c.id === id ? { ...c, ...updates } : c));
              addLog('customer', 'Update Profil Pelanggan', `Memperbarui data pelanggan ID ${id}.`);
            },
            onDeleteCustomer: (id) => {
              setCustomers(prev => prev.filter(c => c.id !== id));
              addLog('customer', 'Pelanggan Dihapus', `Menghapus pelanggan ID ${id}.`);
            }
          }),
          currentTab === 'transactions' && h(TransactionsView, {
            transactions,
            onOpenInvoice: (trx) => setActiveInvoice(trx)
          }),
          currentTab === 'followup' && h(FollowUpView, {
            followUps,
            customers,
            settings,
            onUpdateStatus: (id, status) => {
              setFollowUps(prev => prev.map(f => f.id === id ? { ...f, status } : f));
              addLog('customer', 'Status Follow-up Diperbarui', `Jadwal follow-up ID ${id} diubah ke "${status}".`);
            },
            onAddFollowUp: (item) => {
              setFollowUps(prev => [{ ...item, id: 'flw-' + Date.now() }, ...prev]);
            }
          }),
          currentTab === 'wishlist' && h(WishlistView, {
            wishlistItems,
            onRestock: handleRestockWishlist,
            onBroadcast: handleBroadcastWishlist,
            settings
          }),
          currentTab === 'loyalty' && h(LoyaltyView, {
            vouchers,
            customers,
            onToggleVoucher: handleToggleVoucher,
            onAddVoucher: handleAddVoucher
          }),
          currentTab === 'service' && h(ServiceView, {
            tickets,
            customers,
            onAddTicket: (t) => {
              setTickets(prev => [{ ...t, id: 'TCK-' + Math.floor(100 + Math.random() * 900) }, ...prev]);
              addLog('ticket', 'Tiket Layanan Baru', `Tiket baru dari ${t.customerName}.`);
            },
            onUpdateTicketStatus: (id, status) => {
              setTickets(prev => prev.map(tk => tk.id === id ? { ...tk, status } : tk));
              addLog('ticket', 'Tiket Diselesaikan', `Tiket ${id} ditandai ${status}.`);
            }
          }),
          currentTab === 'settings' && h(SettingsView, {
            settings,
            onUpdateSettings: (newS) => {
              setSettings(prev => ({ ...prev, ...newS }));
              addLog('setting', 'Pengaturan Butik Disimpan', 'Memperbarui profil butik ALLURE.');
            },
            activityLogs,
            onResetDemo: handleResetAll,
            currentUser
          })
        ),

        // Footer
        h('footer', { className: 'py-4 px-8 border-t border-[#EFE8DE] text-center text-xs text-[#6B7280] bg-white' },
          '© 2026 ALLURE • BUSINESS SPACE • Everything Behind Allure • All Rights Reserved'
        )
      ),

      // Invoice Modal
      h(InvoiceModal, {
        activeInvoice,
        onClose: () => setActiveInvoice(null),
        settings
      })
    );
  }

  // Mount Application
  function mount() {
    if (window.__ALLURE_VITE_ACTIVE__) return;
    const rootEl = document.getElementById('root');
    if (rootEl) {
      const root = window.ReactDOM.createRoot(rootEl);
      window.__ALLURE_STANDALONE_ROOT__ = root;
      root.render(h(AllureApp));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();

</script>
</body>
</html>
