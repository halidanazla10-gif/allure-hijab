    // Global PWA State Store
    window.__ALLURE_PWA__ = {
      deferredPrompt: null,
      isInstalled: false,
      isStandalone: window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true,
      listeners: []
    };

    // Capture install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__ALLURE_PWA__.deferredPrompt = e;
      window.__ALLURE_PWA__.notifyListeners();
    });

    // Detect successful install
    window.addEventListener('appinstalled', () => {
      window.__ALLURE_PWA__.isInstalled = true;
      window.__ALLURE_PWA__.deferredPrompt = null;
      window.__ALLURE_PWA__.notifyListeners();
      console.log('🌸 [ALLURE] Aplikasi ALLURE berhasil diinstal di perangkat.');
    });

    window.__ALLURE_PWA__.subscribe = function(cb) {
      window.__ALLURE_PWA__.listeners.push(cb);
      cb({
        canInstall: !!window.__ALLURE_PWA__.deferredPrompt,
        isInstalled: window.__ALLURE_PWA__.isInstalled,
        isStandalone: window.__ALLURE_PWA__.isStandalone
      });
      return () => {
        window.__ALLURE_PWA__.listeners = window.__ALLURE_PWA__.listeners.filter(l => l !== cb);
      };
    };

    window.__ALLURE_PWA__.notifyListeners = function() {
      const state = {
        canInstall: !!window.__ALLURE_PWA__.deferredPrompt,
        isInstalled: window.__ALLURE_PWA__.isInstalled,
        isStandalone: window.__ALLURE_PWA__.isStandalone
      };
      window.__ALLURE_PWA__.listeners.forEach(cb => {
        try { cb(state); } catch(err) { /* silent */ }
      });
    };

    // Global trigger for Install prompt
    window.promptAllureInstall = async function() {
      const pwa = window.__ALLURE_PWA__;
      if (pwa.deferredPrompt) {
        pwa.deferredPrompt.prompt();
        const choice = await pwa.deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          console.log('🌸 [ALLURE] Pengguna menerima pemasangan aplikasi');
        }
        pwa.deferredPrompt = null;
        pwa.notifyListeners();
      } else if (pwa.isStandalone) {
        alert('✨ Aplikasi ALLURE sudah terpasang dan berjalan dalam mode aplikasi desktop!');
      } else {
        alert('🌸 Pasang ALLURE sebagai Aplikasi Desktop:\n\n1. Klik ikon "Install" di address bar browser Anda, ATAU\n2. Buka menu browser (titik 3 di kanan atas) > pilih "Aplikasi" / "Apps" > "Instal ALLURE ini sebagai aplikasi".\n\nAplikasi akan langsung muncul di Desktop & Taskbar tanpa browser address bar!');
      }
    };

          })
          .catch((error) => {
            console.warn('⚠️ [ALLURE] Service Worker registration skipped:', error);
          });
      });
    }

  <!-- Global Diagnostic & Self-Healing Utilities -->
  <script>
    window.clearAllureCacheAndReload = function() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) caches.delete(names[i]);
          });
        }
      } catch (e) {
        console.warn('Cache clear error:', e);
      }
      setTimeout(function() {
        window.location.reload(true);
      }, 150);
    };

    window.addEventListener('error', function(e) {
      console.error('ALLURE Global Error:', e);
      var diag = document.getElementById('allure-loader-diagnostics');
      var errEl = document.getElementById('allure-loader-error-text');
      if (diag) diag.style.display = 'block';
      if (errEl) {
        errEl.textContent = (e && e.message) ? e.message : 'Terjadi kendala saat memuat engine.';
        errEl.style.display = 'block';
      }
    });

    setTimeout(function() {
      if (!window.__ALLURE_STANDALONE_ROOT__) {
        var diag = document.getElementById('allure-loader-diagnostics');
        if (diag) diag.style.display = 'block';
      }
    }, 2000);

  function formatRupiah(amount) {
    if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
    return 'Rp ' + Math.round(amount).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatDate(dateStr) {
    try {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(d);
    } catch {
      return dateStr;
    }
  }

  function cleanPhone(phone) {
    if (!phone) return '';
    let cleaned = phone.replace(/\D/g, '');
    if (cleaned.startsWith('0')) cleaned = '62' + cleaned.slice(1);
    else if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
    return cleaned;
  }

  function normalizePhoneForMatching(phone) {
    if (!phone) return '';
    let digits = String(phone).replace(/\D/g, '');
    if (digits.startsWith('62')) {
      digits = '0' + digits.slice(2);
    } else if (digits.startsWith('8')) {
      digits = '0' + digits;
    }
    return digits;
  }

  function getTierMultiplier(tier) {
    switch (tier) {
      case 'Platinum': return 2.0;
      case 'Gold': return 1.5;
      case 'Silver': return 1.2;
      default: return 1.0;
    }
  }

  function calculateTier(points) {
    if (points >= 3500) return 'Platinum';
    if (points >= 1500) return 'Gold';
    if (points >= 500) return 'Silver';
    return 'Bronze';

  function generateWhatsAppMessage(customerName, category, brandName = 'ALLURE') {
    const firstName = customerName.split(' ')[0] || customerName;
    switch (category) {
      case 'Follow-up Keranjang Belanja':
        return `Halo Kak ${firstName}, salam hangat dari ${brandName}! ✨\n\nKami melihat Kakak sempat memilih koleksi hijab premium kami namun belum sempat menyelesaikan pesanan. Apakah ada warna atau ukuran yang ingin dikonsultasikan? Stok koleksi eksklusif ini sangat terbatas lho Kak. Hubungi kami jika butuh bantuan ya!`;
      case 'Promo Peluncuran Hijab Baru':
        return `Assalamu'alaikum Kak ${firstName}! 🌸\n\nKabar gembira dari ${brandName}! Koleksi terbaru *Parisian Silk & Pashmina Viscose Turkey* kini resmi dirilis dengan pilihan warna nude & earthy tone yang elegan. Dapatkan penawaran istimewa untuk pembelian hari ini. Intip koleksinya sekarang yuk Kak!`;
      case 'Penawaran Khusus Member VIP':
        return `Halo Kak ${firstName} yang terhormat, member VIP ${brandName} tercinta 👑\n\nSebagai bentuk apresiasi atas kesetiaan Kakak, kami menyiapkan voucher apresiasi eksklusif dengan diskon istimewa + double loyalty points untuk kunjungan/pembelian minggu ini. Terima kasih telah selalu tampil anggun bersama ${brandName}.`;
      case 'Cek Kepuasan Pelanggan':
        return `Assalamu'alaikum Kak ${firstName}! 🤍\n\nPesanan hijab dari ${brandName} sudah sampai dengan baik ya Kak? Bagaimana kenyamanan bahan dan warnanya saat dikenakan? Masukan dari Kakak sangat berharga bagi kami untuk terus menghadirkan karya terbaik. Selamat beraktivitas!`;
      default:
        return `Halo Kak ${firstName}, terima kasih telah menjadi bagian dari keluarga ${brandName}.`;
    }
  }

  function generateWhatsAppUrl(phone, customerName, category, brandName = 'ALLURE') {
    const cp = cleanPhone(phone);
    const msg = generateWhatsAppMessage(customerName, category, brandName);
    return `https://wa.me/${cp}?text=${encodeURIComponent(msg)}`;
  }

  function ensureProductImages(products) {
    const fallbackImages = {
      'Pashmina Viscose': 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80',
      'Pashmina Kaos': 'https://images.unsplash.com/photo-1609357605129-26f69add5d6e?auto=format&fit=crop&w=600&q=80',
      'Segi Empat Voal': 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=600&q=80',
      'Parisian Silk': 'https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?auto=format&fit=crop&w=600&q=80',
      'Bergo Daily': 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&w=600&q=80',
      'Aksesoris Hijab': 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80'
    };

    return (products || []).map(p => {
      if (!p.image || typeof p.image !== 'string' || p.image.trim() === '') {
        const fallback = fallbackImages[p.category] || fallbackImages['Pashmina Viscose'];
        return { ...p, image: fallback };
      }
      return p;
    });
  }

  function submitOrderReview(transactions, trxId, reviewData) {
    const { rating, comment, customerName, tags } = reviewData;
    const numRating = Math.max(1, Math.min(5, Math.round(Number(rating) || 5)));
    const cleanComment = (comment || '').trim();

    return (transactions || []).map(trx => {
      if (trx.id === trxId) {
        return {
          ...trx,
          review: {
            rating: numRating,
            comment: cleanComment,
            createdAt: new Date().toISOString(),
            customerName: customerName || trx.customerName || 'Pelanggan Butik',
            tags: Array.isArray(tags) ? tags : []
          }
        };
      }
      return trx;
    });
  }

  function isOrderCompleted(trx) {
    if (!trx) return false;
    if (trx.status === 'Completed') return true;
    if (trx.orderStatus === 'Selesai') return true;
    const s = String(trx.fulfillmentStatus || '').toLowerCase();
    return (
      s === 'selesai' ||
      s.startsWith('selesai') ||
      s.includes('selesai') ||
      s === 'pesanan selesai' ||
      s === 'telah diterima' ||
      s === 'diterima'
    );
  }

    const [reviewSuccessNotice, setReviewSuccessNotice] = useState(null);

    const REVIEW_TAGS = [
      'Bahan Lembut & Dingin',
      'Tegak Paripurna',
      'Warna Sesuai Foto',
      'Jahitan Rapi',
      'Packaging Aman'
    ];

    const handleOpenReviewModal = (trx) => {
      setReviewModalTrx(trx);
      setReviewRating(trx.review ? trx.review.rating : 5);
      setReviewComment(trx.review ? trx.review.comment : '');
      setReviewSelectedTags(trx.review && trx.review.tags ? [...trx.review.tags] : []);
    };

    const handleToggleTag = (tag) => {
      setReviewSelectedTags(prev => {
        const exists = prev.includes(tag);
        return exists ? prev.filter(t => t !== tag) : [...prev, tag];
      });
    };

    const handleSubmitReview = (e) => {
      e.preventDefault();
      if (!reviewModalTrx) return;
      if (onSubmitReview) {
        onSubmitReview(reviewModalTrx.id, {
          rating: reviewRating,
          comment: reviewComment.trim() || `Produk hijab sangat bagus dan memuaskan. [Tags: ${reviewSelectedTags.join(', ')}]`,
          customerName: currentCustomer ? currentCustomer.name : reviewModalTrx.customerName,
          tags: reviewSelectedTags
        });
      }
      setReviewSuccessNotice(`Alhamdulillah! Terima kasih atas ulasan bintang ${reviewRating} Kakak untuk pesanan ${reviewModalTrx.id}. Masukan Kakak sangat berharga untuk butik ALLURE.`);
      setReviewModalTrx(null);
      setReviewComment('');
      setReviewSelectedTags([]);
      setTimeout(() => setReviewSuccessNotice(null), 5000);
    };

    // In-App Shopping Cart & Checkout State (No WhatsApp redirect - strictly in-app!)
    const [cart, setCart] = useState([]);
    const [isCartOpen, setIsCartOpen] = useState(false);
    const [selectedColorMap, setSelectedColorMap] = useState({});
    const [checkoutPaymentMethod, setCheckoutPaymentMethod] = useState('BCA Transfer');
    const [selectedVoucherCode, setSelectedVoucherCode] = useState('');
    const [isCheckingOut, setIsCheckingOut] = useState(false);
    const [orderSuccessAlert, setOrderSuccessAlert] = useState(null);
    const [cartToast, setCartToast] = useState(null);

    // Profile Edit State
    const [editName, setEditName] = useState(currentCustomer ? currentCustomer.name : '');
    const [editPhone, setEditPhone] = useState(currentCustomer ? currentCustomer.phone : '');
    const [editEmail, setEditEmail] = useState(currentCustomer ? currentCustomer.email : '');
    const [editCity, setEditCity] = useState(currentCustomer ? currentCustomer.city : '');
    const [editNotes, setEditNotes] = useState(currentCustomer ? currentCustomer.notes : '');
    const [saveSuccess, setSaveSuccess] = useState(false);

    // Active tracking state & copy feedback
    const [copiedResi, setCopiedResi] = useState(null);

    const handleCopyResi = (resi) => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(resi);
        }
      } catch (e) {}
      setCopiedResi(resi);
      setTimeout(() => setCopiedResi(null), 2500);
    };

    const getFulfillmentInfo = (trx) => {
      const isCompleted = isOrderCompleted(trx);
      const status = trx.orderStatus || trx.fulfillmentStatus || (trx.cashierName === 'Self-Checkout Pelanggan' ? 'Pesanan Masuk' : 'Selesai');
      const courier = trx.courierName || 'Kurir Butik ALLURE';
      const resi = trx.trackingNumber && trx.trackingNumber !== '-' ? trx.trackingNumber : '';
      
      let stepIndex = 0;
      let title = status;
      let badgeColor = 'bg-rose-50 text-rose-800 border-rose-200';
      let icon = 'package-plus';
      let desc = 'Pesanan hijab Kakak telah masuk ke sistem butik ALLURE dan segera disiapkan admin.';

      if (isCompleted) {
        stepIndex = 4;
        title = (status === 'Selesai (Ambil di Butik)' || trx.fulfillmentStatus === 'Selesai (Ambil di Butik)') ? 'Selesai (Ambil di Butik)' : 'Selesai';
        badgeColor = 'bg-emerald-50 text-emerald-800 border-emerald-200';
        icon = 'check-circle';
        desc = (status === 'Selesai (Ambil di Butik)' || trx.fulfillmentStatus === 'Selesai (Ambil di Butik)')

          : 'Pesanan telah sampai dan selesai diterima. Terima kasih telah berbelanja di ALLURE!';
      } else if (status === 'Pesanan Masuk') {
        stepIndex = 0;
        title = 'Pesanan Masuk';
        badgeColor = 'bg-rose-50 text-rose-800 border-rose-200';
        icon = 'package-plus';
        desc = 'Pesanan Anda telah berhasil masuk ke sistem butik ALLURE. Tim atelier segera memverifikasi pesanan Anda.';
      } else if (status === 'Belum Bayar') {
        stepIndex = 0;
        title = 'Belum Bayar';
        badgeColor = 'bg-amber-50 text-amber-800 border-amber-200';
        icon = 'credit-card';
        desc = 'Menunggu konfirmasi pembayaran pesanan Kakak.';
      } else if (status === 'Diproses') {
        stepIndex = 1;
        title = 'Diproses';
        badgeColor = 'bg-yellow-50 text-yellow-800 border-yellow-200';
        icon = 'clock';
        desc = 'Pesanan terkonfirmasi dan sedang disiapkan dengan cermat oleh tim butik ALLURE.';
      } else if (status === 'Dikemas' || status === 'Sedang Dikemas') {
        stepIndex = 2;
        title = 'Dikemas';
        badgeColor = 'bg-orange-50 text-orange-800 border-orange-200';
        icon = 'package';
        desc = 'Pesanan hijab Kakak sedang disetrika uap dan dikemas rapi dalam pouch & box atelier.';
      } else if (status === 'Dikirim' || status === 'Sedang Dikirim') {
        stepIndex = 3;
        title = 'Dikirim';
        badgeColor = 'bg-sky-50 text-sky-800 border-sky-200';
        icon = 'truck';
        desc = 'Paket pesanan sedang dalam pengiriman bersama ' + courier + (resi ? ' (Resi: ' + resi + ')' : '') + '.';
      } else if (status === 'Dibatalkan') {
        stepIndex = -1;
        title = 'Dibatalkan';
        badgeColor = 'bg-gray-100 text-gray-600 border-gray-300';
        icon = 'x';
        desc = 'Pesanan telah dibatalkan.';
      }

      return { status, courier, resi, stepIndex, title, badgeColor, icon, desc };

    const renderOrderStepper = (currentStepIndex) => {

      const steps = [
        { label: 'Pesanan Masuk', icon: 'package-plus', short: 'Masuk' },
        { label: 'Diproses', icon: 'clock', short: 'Proses' },
        { label: 'Dikemas', icon: 'package', short: 'Kemas' },
        { label: 'Dikirim', icon: 'truck', short: 'Kirim' },

      return h('div', { className: 'py-2' },
        h('div', { className: 'flex items-center justify-between relative' },

            className: 'absolute top-1/2 left-4 -translate-y-1/2 h-1 bg-[#C48B89] transition-all duration-500 -z-0',

          steps.map((st, idx) => {
            const isPast = idx < currentStepIndex;
            const isCurrent = idx === currentStepIndex;

            let circleStyle = 'bg-white border-2 border-gray-300 text-gray-400';
            let textStyle = 'text-gray-400 font-medium';

            if (isPast) {
              circleStyle = 'bg-[#C48B89] border-2 border-[#C48B89] text-white shadow-xs';
              textStyle = 'text-[#7D4443] font-bold';
            } else if (isCurrent) {
              circleStyle = 'bg-white border-2 border-[#C48B89] text-[#C48B89] ring-4 ring-[#E8C3C4] shadow-xs animate-pulse';
              textStyle = 'text-[#C48B89] font-extrabold';
            }

            return h('div', { key: idx, className: 'flex flex-col items-center relative z-10 space-y-1.5' },

                h(Icon, { name: isPast ? 'check' : st.icon, className: 'w-4 h-4' })

              h('div', { className: 'text-center' },
                h('span', { className: 'text-[10px] hidden sm:inline ' + textStyle }, st.label),
                h('span', { className: 'text-[10px] sm:hidden ' + textStyle }, st.short)
              )
            );
          })
        )
      );

    if (!currentCustomer) {

        h('div', { className: 'bg-white p-8 rounded-3xl border border-[#EFE8DE] shadow-sm max-w-md w-full space-y-4' },
          h('p', { className: 'text-sm text-[#6B7280]' }, 'Sesi pelanggan belum terdeteksi.'),
          h('button', {
            onClick: onLogout,
            className: 'w-full py-2.5 px-4 bg-[#C48B89] text-white rounded-xl text-xs font-bold'

    const myTransactions = (transactions || []).filter(t => t.customerId === currentCustomer.id || (currentCustomer.name && t.customerName && t.customerName.toLowerCase() === currentCustomer.name.toLowerCase()));
    const activeOrders = myTransactions.filter(t => !isOrderCompleted(t) && t.fulfillmentStatus !== 'Dibatalkan');
    const completedOrdersNeedingReview = myTransactions.filter(t => isOrderCompleted(t) && !t.review);
    const totalSpent = myTransactions.length > 0 ? myTransactions.reduce((acc, t) => acc + (t.grandTotal || 0), 0) : (currentCustomer.totalSpent || 0);
    const ordersCount = Math.max(myTransactions.length, currentCustomer.ordersCount || 0);
    const points = currentCustomer.loyaltyPoints || 0;
    const tier = currentCustomer.tier || 'Bronze';

    let nextTier = 'Silver';
    let pointsNeeded = Math.max(0, 500 - points);
    let progressPct = Math.min(100, Math.round((points / 500) * 100));

    if (tier === 'Silver') {
      nextTier = 'Gold';
      pointsNeeded = Math.max(0, 1500 - points);
      progressPct = Math.min(100, Math.round(((points - 500) / 1000) * 100));

      nextTier = 'Platinum';
      pointsNeeded = Math.max(0, 3500 - points);
      progressPct = Math.min(100, Math.round(((points - 1500) / 2000) * 100));

      pointsNeeded = 0;
      progressPct = 100;

    // Cart Calculations
    const cartCount = cart.reduce((acc, it) => acc + it.qty, 0);
    const cartSubtotal = cart.reduce((acc, it) => acc + (it.product.price * it.qty), 0);
    const appliedVoucher = (vouchers || []).find(v => v.code === selectedVoucherCode && v.isActive);
    let cartDiscount = 0;
    if (appliedVoucher && cartSubtotal >= appliedVoucher.minSpend) {
      if (appliedVoucher.discountType === 'percentage') {
        cartDiscount = Math.round((cartSubtotal * appliedVoucher.discountValue) / 100);
        if (appliedVoucher.maxDiscount && cartDiscount > appliedVoucher.maxDiscount) {
          cartDiscount = appliedVoucher.maxDiscount;
        }
      } else {
        cartDiscount = appliedVoucher.discountValue;
      }
    }
    const cartGrandTotal = Math.max(0, cartSubtotal - cartDiscount);
    const cartPointsEarned = Math.round(Math.floor(cartGrandTotal / 1000) * tierMultiplier * ((settings && settings.pointsMultiplier) || 1));

    // Cart Handlers
    const handleAddToCart = (product, colorOverride) => {
      if (product.stock <= 0) {
        alert('Maaf, stok produk ini sedang habis.');
        return;
      }
      const chosenColor = colorOverride || selectedColorMap[product.id] || (product.colors && product.colors[0]) || 'Standard';
      setCart(prev => {
        const existingIdx = prev.findIndex(item => item.product.id === product.id && item.selectedColor === chosenColor);
        if (existingIdx >= 0) {
          const currentQty = prev[existingIdx].qty;
          if (currentQty >= product.stock) {
            alert('Maksimal pesanan sesuai sisa stok (' + product.stock + ' pcs).');
            return prev;
          }
          const updated = [...prev];
          updated[existingIdx] = { ...updated[existingIdx], qty: currentQty + 1 };
          return updated;
        } else {
          return [...prev, { product, qty: 1, selectedColor: chosenColor }];
        }
      });
      setCartToast('✓ "' + product.name + '" ditambahkan ke keranjang.');
      setTimeout(() => setCartToast(null), 2500);
    };

    const handleDirectBuy = (product) => {
      handleAddToCart(product);
      setIsCartOpen(true);
    };

    const handleUpdateCartQty = (productId, color, delta) => {
      setCart(prev => {
        return prev.map(item => {
          if (item.product.id === productId && item.selectedColor === color) {
            const newQty = item.qty + delta;
            if (newQty <= 0) return null;
            if (newQty > item.product.stock) {
              alert('Maksimal pesanan sesuai sisa stok (' + item.product.stock + ' pcs).');
              return item;
            }
            return { ...item, qty: newQty };
          }
          return item;
        }).filter(Boolean);
      });
    };

    const handleRemoveFromCart = (productId, color) => {
      setCart(prev => prev.filter(item => !(item.product.id === productId && item.selectedColor === color)));
    };

    const handleExecuteCheckout = () => {
      if (cart.length === 0) return;
      if (!onProcessOrder) {
        alert('Fitur pemrosesan pesanan sedang diinisialisasi.');
        return;
      }
      setIsCheckingOut(true);
      setTimeout(() => {
        setIsCheckingOut(false);
        const success = onProcessOrder({
          customerId: currentCustomer.id,
          items: cart,
          voucherCode: selectedVoucherCode,
          paymentMethod: checkoutPaymentMethod,
          cashierName: 'Self-Checkout Pelanggan'
        });

        if (success) {
          setCart([]);
          setIsCartOpen(false);
          setSelectedVoucherCode('');
          setOrderSuccessAlert('✓ Pesanan Masuk! Pesanan Anda telah berhasil tercatat di butik ALLURE. Status: Pesanan Masuk (menunggu konfirmasi admin).');
          setActiveTab('orders');
          setTimeout(() => setOrderSuccessAlert(null), 6000);
        }
      }, 350);
    };

    const handleCopyVoucher = (code) => {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code);
        }
      } catch (e) {}
      setCopiedVoucher(code);
      setTimeout(() => setCopiedVoucher(null), 2500);
    };

    const handleSaveProfile = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      onUpdateCustomer(currentCustomer.id, {
        name: editName.trim() || currentCustomer.name,
        phone: editPhone.trim() || currentCustomer.phone,
        email: editEmail.trim(),
        city: editCity.trim(),
        notes: editNotes.trim()
      });
      setSaveSuccess(true);
      setTimeout(() => setSaveSuccess(false), 3000);
    };

    const categories = ['all', ...Array.from(new Set((products || []).map(p => p.category)))];
    const filteredProducts = (products || []).filter(p => {
      const matchSearch = p.name.toLowerCase().includes(catalogSearch.toLowerCase()) ||
        p.category.toLowerCase().includes(catalogSearch.toLowerCase()) ||
        (p.material && p.material.toLowerCase().includes(catalogSearch.toLowerCase()));
      const matchCat = selectedCategory === 'all' || p.category === selectedCategory;
      return matchSearch && matchCat;
    });

    const tierBadgeBg = tier === 'Platinum' ? 'bg-[#3E2020] text-[#FAF7F2]' :
      tier === 'Gold' ? 'bg-amber-100 text-amber-900 border border-amber-300' :
      tier === 'Silver' ? 'bg-slate-100 text-slate-800 border border-slate-300' :
      'bg-[#FDF8F7] text-[#7D4443] border border-[#E8C3C4]';

    return h('div', { className: 'min-h-screen bg-[#FAF7F2] text-[#1F2937] flex flex-col font-sans selection:bg-[#E8C3C4] selection:text-[#7D4443]' },
      // Top Navigation Header
      h('header', { className: 'sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#EFE8DE] px-4 lg:px-8 py-3.5 flex items-center justify-between shadow-xs' },
        // Left brand
        h('div', { className: 'flex items-center gap-3' },
          h('div', { className: 'w-10 h-10 rounded-2xl bg-[#C48B89] flex items-center justify-center text-white shadow-sm' },
            h(Icon, { name: 'sparkles', className: 'w-5 h-5 text-white' })
          ),
          h('div', null,
            h('div', { className: 'flex items-center gap-2' },
              h('h1', { className: 'font-serif text-xl sm:text-2xl font-bold tracking-wider text-[#1F2937]' }, (settings && settings.brandName) || 'ALLURE'),
              h('span', { className: 'px-2 py-0.5 rounded-full bg-[#FDF8F7] border border-[#E8C3C4] text-[10px] font-bold text-[#7D4443] uppercase' }, 'VIP Member')
            ),
            h('p', { className: 'text-[10px] text-[#6B7280]' }, 'Portal Belanja & Layanan Pelanggan')

        ),

        h('div', { className: 'flex items-center gap-2 sm:gap-3' },
          // In-App Cart Trigger Button
          h('button', {
            type: 'button',
            onClick: () => setIsCartOpen(true),
            className: 'relative flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-[#FDF8F7] border border-[#E8C3C4] text-[#7D4443] hover:bg-[#F3D8D7] transition-all font-semibold text-xs shadow-xs cursor-pointer'
          },
            h(Icon, { name: 'shopping-cart', className: 'w-4 h-4 text-[#C48B89]' }),
            h('span', { className: 'hidden sm:inline font-bold' }, 'Keranjang'),
            cartCount > 0 && h('span', { className: 'w-5 h-5 rounded-full bg-[#C48B89] text-white flex items-center justify-center text-[10px] font-extrabold ml-0.5' }, cartCount)
          ),

          // Customer Profile Pill
          h('div', { className: 'flex items-center gap-2.5 px-3 py-1.5 rounded-2xl bg-[#FAF7F2] border border-[#EFE8DE]' },
            h('div', { className: 'w-8 h-8 rounded-full bg-[#C48B89] text-white flex items-center justify-center text-xs font-bold' },
              (currentCustomer.name || 'P').slice(0, 2).toUpperCase()
            ),
            h('div', { className: 'hidden sm:block text-left text-xs' },
              h('p', { className: 'font-bold text-[#1F2937] leading-tight' }, currentCustomer.name),
              h('p', { className: 'text-[10px] text-[#B2706E] font-semibold' }, tier + ' Member • ' + points + ' Poin')

          h('div', { className: 'relative overflow-hidden bg-gradient-to-br from-[#F5ECE8] via-white to-[#FDF8F7] p-6 sm:p-8 rounded-3xl border border-[#EFE8DE] shadow-xs' },

                ),
                h('p', { className: 'text-xs text-[#6B7280] max-w-xl' },

  // -------------------------------------------------------------
  // COMPONENT: POS VIEW (MODULE 4)
  // -------------------------------------------------------------
  function PosView({ products, customers, vouchers, onProcessOrder, settings, transactions, onOpenInvoice, onAddCustomer, onUpdateFulfillmentStatus }) {
    const [posTab, setPosTab] = useState('pos');
    const defaultCust = customers.find(c => c.id === 'cust-walkin') || customers[0];
    const [selectedCustId, setSelectedCustId] = useState(defaultCust?.id || '');
    const [buyerName, setBuyerName] = useState(defaultCust?.name || '');
    const [buyerPhone, setBuyerPhone] = useState(defaultCust?.phone || '');
    const [showCrmDropdown, setShowCrmDropdown] = useState(false);
    const [productColorSelections, setProductColorSelections] = useState({});

    const [cashierName, setCashierName] = useState('Halida Nazla (Owner)');
    const [cart, setCart] = useState([]);
    const [voucherInput, setVoucherInput] = useState('');
    const [appliedVoucher, setAppliedVoucher] = useState(null);
    const [paymentMethod, setPaymentMethod] = useState('Debit / Cash');
    const [cashReceived, setCashReceived] = useState('');
    const [searchProd, setSearchProd] = useState('');
    const [selectedCat, setSelectedCat] = useState('all');
    const [errorMessage, setErrorMessage] = useState(null);

    // Smart autocomplete / matching against CRM customers
    const cleanDigits = normalizePhoneForMatching(buyerPhone);
    const cleanN = buyerName.trim().toLowerCase();
    const matchedCustomer = (cleanDigits || cleanN) ? (customers.find(c => {
      const matchPhone = cleanDigits.length >= 8 && normalizePhoneForMatching(c.phone) === cleanDigits;
      const matchName = cleanN.length >= 3 && c.name.toLowerCase() === cleanN;
      return matchPhone || matchName;
    }) || null) : null;

    // Suggestions when typing name
    const nameSuggestions = (cleanN.length >= 2)
      ? customers.filter(c => c.name.toLowerCase().includes(cleanN)).slice(0, 4)
      : [];

    const handleSelectCustomer = (cust) => {
      setSelectedCustId(cust.id);
      setBuyerName(cust.name);
      setBuyerPhone(cust.phone || '');
      setShowCrmDropdown(false);
    };

    const handleClearBuyer = () => {
      setSelectedCustId('');
      setBuyerName('');
      setBuyerPhone('');
    };

    const currCust = customers.find(c => c.id === selectedCustId) || matchedCustomer;
    const subtotal = cart.reduce((s, it) => s + (it.product.price * it.qty), 0);

    let discount = 0;
    if (appliedVoucher) {
      const v = vouchers.find(v => v.code === appliedVoucher && v.isActive);
      if (v && subtotal >= v.minSpend) {
        if (v.discountType === 'percentage') {
          discount = Math.round((subtotal * v.discountValue) / 100);
          if (v.maxDiscount && discount > v.maxDiscount) discount = v.maxDiscount;
        } else {
          discount = v.discountValue;
        }
      }
    }
    const grandTotal = Math.max(0, subtotal - discount);
    const tierMultiplier = currCust ? getTierMultiplier(currCust.tier) : 1;
    const estPoints = Math.round(Math.floor(grandTotal / 1000) * tierMultiplier * (settings.pointsMultiplier || 1));

    const addToCart = (product, chosenColor) => {
      setErrorMessage(null);
      if (product.stock <= 0) {
        setErrorMessage(`Stok untuk "${product.name}" sudah habis!`);
        return;
      }
      const color = chosenColor || productColorSelections[product.id] || (product.colors && product.colors[0]) || '#DDA7A5';
      setCart(prev => {
        const inCartQty = prev.filter(it => it.product.id === product.id).reduce((s, it) => s + it.qty, 0);
        if (inCartQty >= product.stock) {
          setErrorMessage(`Stok maksimal tercapai (${product.stock} pcs)!`);
          return prev;
        }
        const exist = prev.find(it => it.product.id === product.id && it.selectedColor === color);
        if (exist) {
          return prev.map(it => it.product.id === product.id && it.selectedColor === color ? { ...it, qty: it.qty + 1 } : it);
        }
        return [...prev, { product, qty: 1, selectedColor: color }];
      });
    };

    const handleQtyChange = (productId, color, delta) => {
      setErrorMessage(null);
      setCart(prev => {
        const curProd = products.find(p => p.id === productId);
        const totalInCart = prev.filter(it => it.product.id === productId).reduce((s, it) => s + it.qty, 0);
        if (delta > 0 && curProd && totalInCart + delta > curProd.stock) {
          setErrorMessage(`Maksimal stok tercapai (${curProd.stock} pcs) untuk ${curProd.name}.`);
          return prev;
        }
        return prev.map(it => {
          if (it.product.id === productId && it.selectedColor === color) {
            const nextQty = it.qty + delta;
            if (nextQty <= 0) return null;
            return { ...it, qty: nextQty };
          }
          return it;
        }).filter(Boolean);
      });
    };

    const handleCheckout = () => {
      setErrorMessage(null);
      if (!buyerName.trim()) {
        setErrorMessage('Nama Pembeli wajib diisi untuk transaksi offline di butik.');
        return;
      }
      if (cart.length === 0) {
        setErrorMessage('Keranjang kasir masih kosong. Silakan pilih produk pesanan.');
        return;
      }
      if (paymentMethod === 'Debit / Cash' && cashReceived !== '' && Number(cashReceived) < grandTotal) {
        setErrorMessage(`Nominal uang tunai diterima (${formatRupiah(Number(cashReceived))}) kurang dari total tagihan (${formatRupiah(grandTotal)})!`);
        return;
      }

      let custIdToUse = selectedCustId;
      if (!custIdToUse || !customers.some(c => c.id === custIdToUse) || (custIdToUse === 'cust-walkin' && buyerName.trim() && buyerName.trim() !== 'Pelanggan Umum (Walk-in)')) {
        if (matchedCustomer) {
          custIdToUse = matchedCustomer.id;
        } else if (onAddCustomer) {
          const created = onAddCustomer({
            name: buyerName.trim(),
            phone: buyerPhone.trim() || '081200000000',
            city: 'Butik Offline ALLURE'
          });
          if (created && created.id) custIdToUse = created.id;
        }
      }

      const result = onProcessOrder({
        customerId: custIdToUse || 'cust-walkin',
        customerName: buyerName.trim(),
        customerPhone: buyerPhone.trim() || '081200000000',
        customerData: {
          id: custIdToUse || 'cust-walkin',
          name: buyerName.trim(),
          phone: buyerPhone.trim() || '081200000000',
          city: 'Butik Offline ALLURE'
        },
        items: cart,
        voucherCode: appliedVoucher,
        paymentMethod,
        cashierName,
        channel: 'Offline Store'
      });

      if (result) {
        if (onOpenInvoice && typeof result === 'object' && result.id) {
          onOpenInvoice(result);
        }
        setCart([]);
        setAppliedVoucher(null);
        setVoucherInput('');
        setCashReceived('');
        setBuyerName('');
        setBuyerPhone('');
        setSelectedCustId('');
      }
    };

    const filteredProds = products.filter(p => {
      const matchSearch = p.name.toLowerCase().includes(searchProd.toLowerCase()) || p.sku.toLowerCase().includes(searchProd.toLowerCase());
      const matchCat = selectedCat === 'all' || p.category === selectedCat;
      return matchSearch && matchCat;
    });

    return h('div', { className: 'space-y-6' },
      // Header
      h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4' },
        h('div', null,
          h('div', { className: 'flex items-center gap-2 mb-1 flex-wrap' },
            h('h2', { className: 'font-serif text-2xl font-bold text-[#1F2937]' }, 'Kasir Penjualan Butik (POS Offline)'),
            h('span', { className: 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#FDF8F7] text-[#B2706E] border border-[#E8C3C4]' },
              'Khusus Toko Fisik / Pembelian Offline'
            )
          ),
          h('p', { className: 'text-xs text-[#6B7280]' },
            'Pencatatan kasir khusus untuk pembelian langsung di toko butik ALLURE — bayar langsung di kasir & terima barang seketika (tanpa pengiriman kurir).'
          )
        ),
        h('div', { className: 'flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-[#EFE8DE] text-xs' },
          h('span', { className: 'text-[#6B7280] font-medium' }, 'Petugas Kasir:'),
          h('select', {
            value: cashierName,
            onChange: (e) => setCashierName(e.target.value),
            className: 'bg-transparent font-semibold text-[#1F2937] focus:outline-none'
          },
            ['Halida Nazla (Owner)', 'Kasir Butik 1', 'Kasir Butik 2'].map(k => h('option', { key: k, value: k }, k))
          )
        )
      ),

      // Sub-tab: POS vs History
      h('div', { className: 'flex gap-2 border-b border-[#EFE8DE] pb-3' },
        h('button', {
          onClick: () => setPosTab('pos'),
          className: `flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold ${
            posTab === 'pos' ? 'bg-[#C48B89] text-white shadow-xs' : 'bg-white border text-[#6B7280]'
          }`
        },
          h(Icon, { name: 'shopping-cart', className: 'w-3.5 h-3.5' }),
          'Kasir Interaktif (POS)'
        ),
        h('button', {

    }
  };

  const ORDER_STATUS_LIST = [
    'Pesanan Masuk',
    'Belum Bayar',
    'Diproses',
    'Dikemas',
    'Dikirim',
    'Selesai',
    'Dibatalkan'
  ];

  function getNormalizedOrderStatus(trx) {
    if (trx.orderStatus && ORDER_STATUS_CONFIG[trx.orderStatus]) {
      return trx.orderStatus;
    }
    const f = trx.fulfillmentStatus;
    if (f === 'Pesanan Masuk') return 'Pesanan Masuk';
    if (f === 'Sedang Dikemas' || f === 'Dikemas') return 'Dikemas';
    if (f === 'Sedang Dikirim' || f === 'Dikirim') return 'Dikirim';
    if (f === 'Menunggu Konfirmasi' || f === 'Diproses') return 'Diproses';
    if (f === 'Belum Bayar') return 'Belum Bayar';
    if (f === 'Dibatalkan' || trx.status === 'Cancelled') return 'Dibatalkan';
    if (f === 'Selesai' || trx.status === 'Completed') return 'Selesai';
    return 'Pesanan Masuk';
  }

  function WishlistView({ wishlistItems, onRestock, onBroadcast, settings }) {
    const [broadcastModalItem, setBroadcastModalItem] = useState(null);
    const [restockModalItem, setRestockModalItem] = useState(null);
    const [restockQty, setRestockQty] = useState(30);

    const totalWaiting = wishlistItems.reduce((acc, w) => acc + (w.wishlistCount || (w.interestedCustomers ? w.interestedCustomers.length : 0)), 0);
    const outOfStockCount = wishlistItems.filter(i => i.stock <= 0).length;

    const handleExecuteRestock = (e) => {
      e.preventDefault();
      if (!restockModalItem) return;
      onRestock(restockModalItem.id, Number(restockQty));
      setRestockModalItem(null);
      setRestockQty(30);
    };

    const handleExecuteBroadcast = () => {
      if (!broadcastModalItem) return;
      onBroadcast(broadcastModalItem.id);
      setBroadcastModalItem(null);
      alert('Siaran WhatsApp restock berhasil disimulasikan!');

    return h('div', { className: 'space-y-6' },

        h('h2', { className: 'font-serif text-2xl font-bold text-[#1F2937]' }, 'Wishlist & Restock Hijab (Module 7)'),

  class ErrorBoundary extends window.React.Component {
    constructor(props) {
      super(props);
      this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
      return { hasError: true, error };
    }
    componentDidCatch(error, info) {
      console.error('🌸 [ALLURE ErrorBoundary caught]:', error, info);
    }
    render() {
      if (this.state.hasError) {
        return h('div', { className: 'min-h-screen bg-[#FAF7F2] flex items-center justify-center p-6 text-center font-sans' },
          h('div', { className: 'max-w-md bg-white p-8 rounded-3xl shadow-xl border border-[#EFE8DE] space-y-4' },

      }

        localStorage.setItem('allure_vouchers_v1', JSON.stringify(INITIAL_VOUCHERS));
        localStorage.setItem('allure_logs_v1', JSON.stringify(INITIAL_LOGS));
        localStorage.setItem('allure_clean_slate_v8', 'true');
      }
    } catch (e) {
      console.warn('Storage cleaner:', e);
    }

    const [products, setProducts] = useState(() => {
      const saved = localStorage.getItem('allure_products_v1');
      return ensureProductImages(saved ? JSON.parse(saved) : INITIAL_PRODUCTS);
    });

    const [customers, setCustomers] = useState(() => {

    });

    const [wishlistItems, setWishlistItems] = useState(() => {
      const saved = localStorage.getItem('allure_wishlist_v1');
      return saved ? JSON.parse(saved) : INITIAL_WISHLIST;
    });

    const [transactions, setTransactions] = useState(() => {
      const saved = localStorage.getItem('allure_transactions_v1');
      return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
    });

    const [followUps, setFollowUps] = useState(() => {
      const saved = localStorage.getItem('allure_followups_v1');
      return saved ? JSON.parse(saved) : INITIAL_FOLLOW_UPS;
    });

    const [vouchers, setVouchers] = useState(() => {
      const saved = localStorage.getItem('allure_vouchers_v1');
      return saved ? JSON.parse(saved) : INITIAL_VOUCHERS;
    });

    const [tickets, setTickets] = useState(() => {
      const saved = localStorage.getItem('allure_tickets_v1');
      return saved ? JSON.parse(saved) : INITIAL_TICKETS;
    });

    const [activityLogs, setActivityLogs] = useState(() => {
      const saved = localStorage.getItem('allure_logs_v1');
      return saved ? JSON.parse(saved) : INITIAL_LOGS;
    });

    const [settings, setSettings] = useState(() => {
      try {
        const saved = localStorage.getItem('allure_settings_v1');
        const loaded = saved ? JSON.parse(saved) : INITIAL_SETTINGS;
        if (!loaded.subTagline || loaded.tagline === 'Modest Elegance & Boutique Atelier' || loaded.tagline === 'Modest Elegance & Atelier') {
          return {
            ...loaded,
            tagline: 'BUSINESS SPACE',
            subTagline: 'Everything Behind Allure'
          };
        }
        return loaded;
      } catch (e) {
        return INITIAL_SETTINGS;
      }
    });

    // Navigation and Modals
    const [currentTab, setCurrentTab] = useState('dashboard');
    const [isMobileOpen, setIsMobileOpen] = useState(false);
    const [searchQuery, setSearchQuery] = useState('');
    const [activeInvoice, setActiveInvoice] = useState(null);

    // Dropdowns
    const [isNotifOpen, setIsNotifOpen] = useState(false);
    const [isProfileOpen, setIsProfileOpen] = useState(false);

    // Sync to storage
    useEffect(() => {
      try {
        if (isAuthenticated) {
          sessionStorage.setItem('allure_session_active', 'true');
        } else {
          sessionStorage.removeItem('allure_session_active');
          localStorage.removeItem('allure_auth_v1');
        }
      } catch (e) {}
    }, [isAuthenticated]);
    useEffect(() => { localStorage.setItem('allure_products_v1', JSON.stringify(products)); }, [products]);
    useEffect(() => { localStorage.setItem('allure_customers_v1', JSON.stringify(customers)); }, [customers]);
    useEffect(() => { localStorage.setItem('allure_wishlist_v1', JSON.stringify(wishlistItems)); }, [wishlistItems]);
    useEffect(() => { localStorage.setItem('allure_transactions_v1', JSON.stringify(transactions)); }, [transactions]);
    useEffect(() => { localStorage.setItem('allure_followups_v1', JSON.stringify(followUps)); }, [followUps]);
    useEffect(() => { localStorage.setItem('allure_vouchers_v1', JSON.stringify(vouchers)); }, [vouchers]);
    useEffect(() => { localStorage.setItem('allure_tickets_v1', JSON.stringify(tickets)); }, [tickets]);
    useEffect(() => { localStorage.setItem('allure_logs_v1', JSON.stringify(activityLogs)); }, [activityLogs]);
    useEffect(() => { localStorage.setItem('allure_settings_v1', JSON.stringify(settings)); }, [settings]);

    // Real-Time Multi-Device / Tab Live Synchronization
    useEffect(() => {
      const syncFromStorage = () => {
        try {
          const p = localStorage.getItem('allure_products_v1');
          if (p) setProducts(JSON.parse(p));
          const c = localStorage.getItem('allure_customers_v1');
          if (c) {
            const parsedC = JSON.parse(c);
            setCustomers(parsedC);
            if (currentCustomer) {
              const found = parsedC.find(x => x.id === currentCustomer.id);
              if (found) setCurrentCustomer(found);
            }
          }
          const t = localStorage.getItem('allure_transactions_v1');
          if (t) setTransactions(JSON.parse(t));
          const f = localStorage.getItem('allure_followups_v1');
          if (f) setFollowUps(JSON.parse(f));
          const l = localStorage.getItem('allure_logs_v1');
          if (l) setActivityLogs(JSON.parse(l));
        } catch (e) {}
      };

      window.addEventListener('storage', syncFromStorage);
      let ch = null;
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          ch = new BroadcastChannel('allure_live_sync');
          ch.onmessage = () => syncFromStorage();
        }
      } catch (e) {}
      return () => {
        window.removeEventListener('storage', syncFromStorage);
        if (ch) ch.close();
      };
    }, [currentCustomer ? currentCustomer.id : null]);

    const addLog = (type, title, description, actor = 'Siti Admin') => {
      const entry = {
        id: 'log-' + Date.now(),
        timestamp: new Date().toISOString(),
        type,
        title,
        description,
        actor
      };
      setActivityLogs(prev => [entry, ...prev.slice(0, 49)]);
    };

    // Core POS Checkout
    const handleProcessOrder = ({ customerId, items, voucherCode, paymentMethod, cashierName, channel, customerName, customerPhone, customerData }) => {
      let cust = customers.find(c => c.id === customerId);
      if (!cust && currentCustomer && currentCustomer.id === customerId) {
        cust = currentCustomer;
        setCustomers(prev => [cust, ...prev]);
      }
      if (!cust && currentCustomer) {
        cust = currentCustomer;
        setCustomers(prev => [cust, ...prev]);
      }
      if (!cust) {
        const fallbackName = (customerData && customerData.name) || customerName || (currentCustomer && currentCustomer.name) || 'Pelanggan Butik';
        const fallbackPhone = (customerData && customerData.phone) || customerPhone || (currentCustomer && currentCustomer.phone) || '081200000000';
        const fallbackCity = (customerData && customerData.city) || 'Butik Offline ALLURE';
        cust = {
          id: customerId || 'cust-' + Date.now(),
          name: fallbackName,
          phone: fallbackPhone,
          email: (customerData && customerData.email) || '',
          city: fallbackCity,
          tier: 'Bronze',
          loyaltyPoints: 0,
          totalSpent: 0,
          ordersCount: 0
        };
        setCustomers(prev => [cust, ...prev]);
      } else if (cust.id === 'cust-walkin' && customerName && customerName !== 'Pelanggan Umum (Walk-in)') {
        cust = { ...cust, name: customerName, phone: customerPhone || cust.phone || '081200000000' };
      }

      // Stock check
      const qtyMap = {};
      for (const it of items) qtyMap[it.product.id] = (qtyMap[it.product.id] || 0) + it.qty;
      for (const [pId, reqQty] of Object.entries(qtyMap)) {
        const prod = products.find(p => p.id === pId);
        if (!prod || prod.stock < reqQty) {
          alert(`Stok ${prod ? prod.name : 'produk'} tidak mencukupi!`);
          return false;
        }
      }

      let subtotal = 0;
      const trxItems = items.map(it => {
        const lineTotal = it.product.price * it.qty;
        subtotal += lineTotal;
        return {
          productId: it.product.id,
          productName: it.product.name,
          sku: it.product.sku,
          price: it.product.price,
          qty: it.qty,
          color: it.selectedColor,
          subtotal: lineTotal
        };
      });

      let discountAmount = 0;
      let appliedVoucherCode = null;
      if (voucherCode) {
        const v = vouchers.find(v => v.code === voucherCode && v.isActive);
        if (v && subtotal >= v.minSpend) {
          appliedVoucherCode = v.code;
          if (v.discountType === 'percentage') {
            discountAmount = Math.round((subtotal * v.discountValue) / 100);
            if (v.maxDiscount && discountAmount > v.maxDiscount) discountAmount = v.maxDiscount;
          } else {
            discountAmount = v.discountValue;
          }
        }
      }

      const grandTotal = Math.max(0, subtotal - discountAmount);
      const tierMult = getTierMultiplier(cust.tier || 'Bronze');
      const loyaltyEarned = Math.round(Math.floor(grandTotal / 1000) * tierMult * (settings.pointsMultiplier || 1));

      const trxId = 'TRX-' + new Date().toISOString().slice(0, 7).replace('-', '') + '-' + Math.floor(1000 + Math.random() * 9000);
      const isOfflineOrder = channel === 'Offline Store' || (cashierName && cashierName !== 'Self-Checkout Pelanggan');

      const newTrx = {
        id: trxId,

              'Buka Kasir'
            ),

            // Install Aplikasi ALLURE (PWA & Desktop) Button
            h('button', {
              type: 'button',
              onClick: () => {
                if (window.promptAllureInstall) window.promptAllureInstall();
              },
              title: 'Pasang ALLURE sebagai aplikasi mandiri di Taskbar/Desktop',
              className: 'flex items-center gap-1.5 px-3 py-1.5 bg-[#FDF8F7] hover:bg-[#F3D8D7] text-[#7D4443] border border-[#E8C3C4] text-xs font-semibold rounded-xl transition-all shadow-xs cursor-pointer'
            },
              h(Icon, { name: 'download', className: 'w-3.5 h-3.5 text-[#B2706E]' }),
              h('span', { className: 'hidden md:inline' }, 'Install App')
            ),

            // Notification Bell
            h('div', { className: 'relative' },
              h('button', {
                onClick: () => { setIsNotifOpen(!isNotifOpen); setIsProfileOpen(false); },
                className: 'p-2 rounded-xl border border-[#EFE8DE] text-[#6B7280] hover:text-[#1F2937] hover:bg-[#FAF7F2] relative'
              },
                h(Icon, { name: 'bell', className: 'w-4 h-4' }),
                totalAlerts > 0 && h('span', { className: 'absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white rounded-full text-[9px] font-bold flex items-center justify-center animate-pulse' }, totalAlerts)
              ),

              isNotifOpen && h('div', { className: 'absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-[#EFE8DE] p-4 z-50 space-y-3' },
                h('div', { className: 'flex justify-between items-center border-b border-gray-100 pb-2' },
                  h('span', { className: 'text-xs font-bold text-[#1F2937]' }, `Notifikasi (${totalAlerts})`),
                  h('span', { className: 'text-[10px] text-[#B2706E] cursor-pointer font-semibold', onClick: () => setIsNotifOpen(false) }, 'Tutup')
                ),
                h('div', { className: 'space-y-2 max-h-60 overflow-y-auto text-xs' },
                  lowStockItems.length > 0 && h('div', { className: 'p-2.5 rounded-xl bg-rose-50 border border-rose-100' },
                    h('p', { className: 'font-semibold text-rose-800' }, '⚠️ Peringatan Stok Menipis'),
                    h('p', { className: 'text-[11px] text-rose-600 mt-0.5' }, `${lowStockItems.length} produk hijab tersisa < 5 pcs.`),
                    h('button', { onClick: () => { setCurrentTab('products'); setIsNotifOpen(false); }, className: 'text-[10px] text-rose-700 font-bold underline mt-1 block' }, 'Buka Katalog Hijab →')
                  ),
                  pendingFollowUps.length > 0 && h('div', { className: 'p-2.5 rounded-xl bg-emerald-50 border border-emerald-100' },
                    h('p', { className: 'font-semibold text-emerald-800' }, '💬 Follow-up Tertunda'),
                    h('p', { className: 'text-[11px] text-emerald-700 mt-0.5' }, `${pendingFollowUps.length} pesan WhatsApp perlu dikirim hari ini.`),
                    h('button', { onClick: () => { setCurrentTab('followup'); setIsNotifOpen(false); }, className: 'text-[10px] text-emerald-800 font-bold underline mt-1 block' }, 'Buka CRM Follow-Up →')
                  ),
                  totalAlerts === 0 && h('p', { className: 'text-center py-4 text-[#6B7280] italic' }, 'Semua notifikasi aman.')
                )
              )
            ),

            // Admin Profile Dropdown
            h('div', { className: 'relative' },
              h('button', {
                onClick: () => { setIsProfileOpen(!isProfileOpen); setIsNotifOpen(false); },
                className: 'flex items-center gap-2 p-1.5 sm:px-3 sm:py-1.5 rounded-xl border border-[#EFE8DE] hover:border-[#DDA7A5] transition-all'
              },
                h('div', { className: 'w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#C48B89] text-white flex items-center justify-center font-bold text-xs' },
                  currentUser.avatar || 'HN'
                ),
                h('div', { className: 'hidden md:block text-left text-xs' },
                  h('p', { className: 'font-semibold text-[#1F2937] leading-tight' }, currentUser.name),
                  h('p', { className: 'text-[10px] text-[#6B7280] leading-tight' }, currentUser.role)
                )
              ),

              isProfileOpen && h('div', { className: 'absolute right-0 mt-2 w-52 bg-white rounded-2xl shadow-xl border border-[#EFE8DE] p-2 z-50 space-y-1 text-xs' },
                h('div', { className: 'px-3 py-2 border-b border-gray-100' },
                  h('p', { className: 'font-bold text-[#1F2937]' }, currentUser.name),
                  h('p', { className: 'text-[10px] text-[#6B7280]' }, currentUser.email)
                ),
                h('button', {
                  onClick: () => { setCurrentTab('settings'); setIsProfileOpen(false); },
                  className: 'w-full text-left px-3 py-2 hover:bg-[#FDF8F7] rounded-xl text-[#1F2937]'
                }, 'Pengaturan Butik'),
                h('button', {
                  onClick: handleLogout,
                  className: 'w-full text-left px-3 py-2 hover:bg-rose-50 text-rose-600 font-semibold rounded-xl flex items-center gap-1.5'
                },
                  h(Icon, { name: 'log-out', className: 'w-3.5 h-3.5' }),
                  'Keluar (Logout)'
                )
              )
            )
          )
        ),

        // Main Module Render (Hook-safe separate components)
        h('main', { className: 'flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto' },
          currentTab === 'dashboard' && h(DashboardView, {
            products,
            customers,
            transactions,
            followUps,
            settings,
            setCurrentTab
          }),
          currentTab === 'pos' && h(PosView, {
            products,
            customers,
            vouchers,
            onProcessOrder: handleProcessOrder,
            settings,
            transactions,
            onOpenInvoice: (trx) => setActiveInvoice(trx),
            onUpdateFulfillmentStatus: handleUpdateFulfillmentStatus,
            onAddCustomer: (newC) => {
              const c = {
                id: 'cust-' + Date.now(),
                ...newC,
                tier: 'Bronze',
                loyaltyPoints: 0,
                totalSpent: 0,
                total_pengeluaran: 0,
                ordersCount: 0,
                jumlah_transaksi: 0,
                joinedDate: new Date().toISOString().slice(0, 10),
                lastOrderDate: '-'
              };
              setCustomers(prev => [c, ...prev]);
              addLog('customer', 'Pelanggan Walk-in Terdaftar', `Menambahkan Kak ${c.name} dari kasir POS.`);
              return c;
            }
          }),
          currentTab === 'products' && h(ProductsView, {
            products,
            onAddProduct: (newP) => {
              setProducts(prev => [{ ...newP, id: 'prod-' + Date.now() }, ...prev]);
              addLog('stock', 'Produk Baru Ditambahkan', `Menambahkan katalog "${newP.name}".`);
            },
            onUpdateProduct: (id, updates) => {
              setProducts(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));
              addLog('stock', 'Perubahan Data Produk', `Memperbarui katalog produk ID ${id}.`);
            },
            onDeleteProduct: (id) => {
              setProducts(prev => prev.filter(p => p.id !== id));
              addLog('stock', 'Produk Dihapus', `Menghapus produk ID ${id}.`);
            },
            onAdjustStock: (id, delta) => {
              setProducts(prev => prev.map(p => p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p));
            }
          }),
          currentTab === 'customers' && h(CustomersView, {
            transactions,
            customers,
            onAddCustomer: (newC) => {
              const c = {
                id: 'cust-' + Date.now(),
                ...newC,
                tier: 'Bronze',
                loyaltyPoints: 0,
                totalSpent: 0,
                total_pengeluaran: 0,
                ordersCount: 0,
                jumlah_transaksi: 0,
                joinedDate: new Date().toISOString().slice(0, 10),
                lastOrderDate: '-'
              };
              setCustomers(prev => [c, ...prev]);
              addLog('customer', 'Pelanggan Baru Terdaftar', `Menambahkan Kak ${c.name}.`);
            },
            onUpdateCustomer: (id, updates) => {
              setCustomers(prev => prev.map(c => c.id === id ? { ...c, ...updates } : c));
              addLog('customer', 'Update Profil Pelanggan', `Memperbarui data pelanggan ID ${id}.`);
            },
            onDeleteCustomer: (id) => {
              setCustomers(prev => prev.filter(c => c.id !== id));
              addLog('customer', 'Pelanggan Dihapus', `Menghapus pelanggan ID ${id}.`);
            }
          }),
          currentTab === 'transactions' && h(TransactionsView, {
            transactions,
            onOpenInvoice: (trx) => setActiveInvoice(trx),
            onUpdateFulfillmentStatus: handleUpdateFulfillmentStatus
          }),
          currentTab === 'followup' && h(FollowUpView, {
            followUps,
            customers,
            settings,
            onUpdateStatus: (id, status) => {
              setFollowUps(prev => prev.map(f => f.id === id ? { ...f, status } : f));
              addLog('customer', 'Status Follow-up Diperbarui', `Jadwal follow-up ID ${id} diubah ke "${status}".`);
            },
            onAddFollowUp: (item) => {
              setFollowUps(prev => [{ ...item, id: 'flw-' + Date.now() }, ...prev]);
            }
          }),
          currentTab === 'wishlist' && h(WishlistView, {
            wishlistItems,
            onRestock: handleRestockWishlist,
            onBroadcast: handleBroadcastWishlist,
            settings
          }),
          currentTab === 'service' && h(ServiceView, {
            tickets,
            customers,
            onAddTicket: (t) => {
              setTickets(prev => [{ ...t, id: 'TCK-' + Math.floor(100 + Math.random() * 900) }, ...prev]);
              addLog('ticket', 'Tiket Layanan Baru', `Tiket baru dari ${t.customerName}.`);
            },
            onUpdateTicketStatus: (id, status) => {
              setTickets(prev => prev.map(tk => tk.id === id ? { ...tk, status } : tk));
              addLog('ticket', 'Tiket Diselesaikan', `Tiket ${id} ditandai ${status}.`);
            }
          }),
          currentTab === 'settings' && h(SettingsView, {
            settings,
            onUpdateSettings: (newS) => {
              setSettings(prev => ({ ...prev, ...newS }));
              addLog('setting', 'Pengaturan Butik Disimpan', 'Memperbarui profil butik ALLURE.');
            },
            activityLogs,
            onResetDemo: handleResetAll,
            currentUser
          })
        ),

        // Footer
        h('footer', { className: 'py-4 px-8 border-t border-[#EFE8DE] text-center text-xs text-[#6B7280] bg-white' },
          '© 2026 ALLURE • BUSINESS SPACE • Everything Behind Allure • All Rights Reserved'
        )
      ),

      // Invoice Modal
      h(InvoiceModal, {
        activeInvoice,
        onClose: () => setActiveInvoice(null),
        settings
      })
    );
  }

  // Mount Application
  function mount() {
    if (window.__ALLURE_VITE_ACTIVE__) return;
    const rootEl = document.getElementById('root');
    if (rootEl) {
      const root = window.ReactDOM.createRoot(rootEl);
      window.__ALLURE_STANDALONE_ROOT__ = root;
      root.render(h(ErrorBoundary, null, h(AllureApp)));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
} // end initAllureApp
})();

</script>
</body>
</html>
